<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Maint_Record — দৈনিক রক্ষণাবেক্ষণ কার্যক্রম</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2E2C; --ink-2:#163F3B; --paper:#F6F4EE; --paper-2:#EDEAE1; --line:#D9D4C6;
  --amber:#C77C2C; --amber-2:#E0954A; --rust:#B0483B; --moss:#4B7A5A; --white:#FFFFFF;
  --ink-soft:#5B6A66; --shadow:0 1px 2px rgba(15,46,44,.06),0 4px 14px rgba(15,46,44,.07); --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif;background:radial-gradient(1200px 500px at 100% -10%,rgba(199,124,44,.08),transparent 60%),var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden;}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}
#root{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:82px;}
.topbar{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--paper);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--amber),var(--rust));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;}
.brand-title{font-size:15px;font-weight:600;line-height:1.15;}
.brand-sub{font-size:10.5px;color:#9FC2B8;letter-spacing:.04em;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--paper);width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
.icon-btn:active{background:rgba(255,255,255,.18);}
main{padding:16px 16px 24px;}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card-title .tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--amber);background:rgba(199,124,44,.1);border:1px solid rgba(199,124,44,.25);padding:2px 6px;border-radius:5px;letter-spacing:.05em;}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.01em;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],input[type=month],textarea,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#fff;}
textarea{resize:vertical;min-height:90px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;transition:transform .06s,opacity .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:var(--rust);border:1.5px solid rgba(176,72,59,.3);}
.btn-ghost{background:rgba(15,46,44,.05);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-mic{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:10px;flex-shrink:0;font-size:16px;}
.btn-mic.rec{background:var(--rust);color:#fff;border-color:var(--rust);animation:pulse 1s infinite;}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:var(--ink);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.15);}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;color:#7FA79C;cursor:pointer;font-size:10px;font-weight:600;letter-spacing:.01em;}
.navitem .ni-ico{font-size:18px;line-height:1;}
.navitem.active{color:var(--amber-2);}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-amber{background:rgba(199,124,44,.12);color:var(--amber);}
.badge-moss{background:rgba(75,122,90,.12);color:var(--moss);}
.badge-rust{background:rgba(176,72,59,.12);color:var(--rust);}
.badge-gray{background:var(--paper-2);color:var(--ink-soft);}
.rec-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
.rec-card .date-block{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);font-weight:600;}
.rec-card h4{margin:2px 0 4px;font-size:14.5px;font-weight:600;}
.rec-card .kks{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
.rec-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.rec-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.rec-actions{display:flex;gap:8px;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;cursor:pointer;margin:0 6px 6px 0;}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip-add{border-style:dashed;color:var(--amber);}
.chipwrap{display:flex;flex-wrap:wrap;margin-bottom:4px;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(15,46,44,.15);border:1px solid var(--line);}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--rust));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:20px;margin:0 auto 16px;}
.spin{width:34px;height:34px;border:3px solid var(--paper-2);border-top-color:var(--amber);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
.empty .ei{font-size:38px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13.5px;margin:4px 0;}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:all .25s ease;max-width:88%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--rust);}
.modal-bg{position:fixed;inset:0;background:rgba(15,46,44,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.center{align-items:center;padding:20px;}
.modal-box{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:slideup .22s ease;}
.modal-bg.center .modal-box{border-radius:18px;max-width:400px;animation:popin .18s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes popin{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:18px;font-weight:700;margin:0;font-family:'Space Grotesk',sans-serif;}
.section-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat-box .sn{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--ink);}
.stat-box .sl{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
.userstat-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--paper-2);}
.userstat-row:last-child{border-bottom:none;}
.userstat-name{flex:1;font-size:13.5px;font-weight:600;}
.userstat-bar{height:8px;border-radius:6px;background:var(--paper-2);flex:2;overflow:hidden;}
.userstat-bar-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--rust));}
.userstat-count{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;width:26px;text-align:right;}
.img-thumb{width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line);display:block;}
.thumbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.thumbgrid .th-wrap{position:relative;}
.thumbgrid img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
.thumbgrid .th-del{position:absolute;top:-6px;right:-6px;background:var(--rust);color:#fff;width:20px;height:20px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.upload-box{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:var(--paper);font-size:12.5px;color:var(--ink-soft);}
.search-box{position:relative;margin-bottom:14px;}
.search-box input{padding-left:36px;}
.search-box::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}
.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.pill{flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
::-webkit-scrollbar{height:5px;width:5px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
.warn-box{background:rgba(176,72,59,.08);border:1px solid rgba(176,72,59,.25);color:var(--rust);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;font-weight:500;}
.info-box{background:rgba(75,122,90,.08);border:1px solid rgba(75,122,90,.25);color:var(--moss);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.sync-dot.on{background:var(--moss);box-shadow:0 0 0 3px rgba(75,122,90,.15);}
.sync-dot.off{background:#C7C2B4;}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite;}
.topbar-sync{display:flex;align-items:center;font-size:10px;color:#9FC2B8;}
.desc-wrap{display:flex;gap:8px;align-items:flex-start;}
.desc-wrap textarea{flex:1;}
.mic-status{font-size:11.5px;color:var(--rust);font-weight:600;margin-top:6px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script>
/* =========================================================
   Maint_Record — GitHub Pages frontend
   Talks ONLY to a Google Apps Script Web App (JSON API) over
   HTTPS. No Google OAuth, Client ID, API key, or Spreadsheet ID
   ever appears in this file or the browser. Login is plain
   username + password; the Apps Script backend hashes and
   verifies passwords and issues session tokens server-side.
   ========================================================= */

const T = {
  appName:'Maint_Record', appSub:'দৈনিক রক্ষণাবেক্ষণ কার্যক্রম',
  username:'ইউজারনেম', password:'পাসওয়ার্ড', signin:'প্রবেশ করুন',
  loginErr:'ইউজারনেম বা পাসওয়ার্ড সঠিক নয়', lockedOut:'অনেকবার ভুল চেষ্টার কারণে সাময়িকভাবে বন্ধ, ১৫ মিনিট পর আবার চেষ্টা করুন',
  navNew:'নতুন রেকর্ড', navRecords:'রেকর্ডস', navStats:'পরিসংখ্যান', navSettings:'সেটিংস', navLogout:'লগআউট',
  newTitle:'নতুন রক্ষণাবেক্ষণ রেকর্ড', editTitle:'রেকর্ড সম্পাদনা',
  date:'তারিখ', equipName:'যন্ত্রের নাম', kks:'কেকেএস (KKS)', workDesc:'রক্ষণাবেক্ষণ কাজের বিবরণ',
  toolsUsed:'ব্যবহৃত টুলস', addNewTool:'+ নতুন টুল যোগ', addNewEquip:'+ নতুন যন্ত্র যোগ করুন',
  photos:'ছবি (ঐচ্ছিক)', tapUpload:'ছবি আপলোড করতে ট্যাপ করুন', uploading:'আপলোড হচ্ছে...',
  save:'সংরক্ষণ করুন', cancel:'বাতিল', update:'আপডেট করুন',
  recordsTitle:'রক্ষণাবেক্ষণ রেকর্ডস', recordsSub:'তারিখ অনুযায়ী প্রদর্শিত',
  noRecords:'কোনো রেকর্ড পাওয়া যায়নি', createFirst:'নতুন রেকর্ড তৈরি করুন',
  edit:'সম্পাদনা', del:'মুছুন', view:'দেখুন',
  confirmDelete:'আপনি কি নিশ্চিতভাবে এই রেকর্ডটি মুছে ফেলতে চান?', yesDelete:'হ্যাঁ, মুছুন',
  statsTitle:'ব্যবহারকারী অনুযায়ী রেকর্ড সংখ্যা', totalRecords:'মোট রেকর্ড', totalToday:'আজকের রেকর্ড',
  month:'মাস', settingsTitle:'সেটিংস', equipMgmt:'যন্ত্রপাতি তালিকা', toolMgmt:'টুলস তালিকা',
  addEquip:'+ যন্ত্র যোগ করুন', addTool:'+ টুল যোগ করুন', active:'সক্রিয়', account:'অ্যাকাউন্ট',
  loggedInAs:'লগইন করা হয়েছে', changePw:'পাসওয়ার্ড পরিবর্তন', newPw:'নতুন পাসওয়ার্ড', pwChanged:'পাসওয়ার্ড পরিবর্তিত হয়েছে',
  fillRequired:'অনুগ্রহ করে সব আবশ্যক তথ্য পূরণ করুন', savedOk:'সফলভাবে সংরক্ষিত হয়েছে', deletedOk:'মুছে ফেলা হয়েছে',
  updatedOk:'আপডেট হয়েছে', na:'নেই', close:'বন্ধ করুন', noData:'কোনো তথ্য নেই', search:'খুঁজুন...',
  setupApiTitle:'সার্ভার সংযোগ সেটআপ', apiUrlLabel:'Apps Script Web App URL',
  apiUrlHelp:'আপনার প্রকাশিত (deployed) Google Apps Script Web App-এর URL এখানে বসান। এই URL গোপন তথ্য নয় — শুধু আপনার সার্ভারের ঠিকানা।',
  saveContinue:'সংরক্ষণ করে এগিয়ে যান', connecting:'সংযোগ হচ্ছে...',
  networkErr:'সার্ভারের সাথে সংযোগ করা যায়নি, ইন্টারনেট ও URL যাচাই করুন', editApiUrl:'সার্ভার ঠিকানা পরিবর্তন করুন',
  sessionExpired:'সেশনের মেয়াদ শেষ, আবার লগইন করুন', selectEquip:'যন্ত্র নির্বাচন করুন',
  micStart:'মাইক্রোফোনে চাপুন এবং বাংলায় বলুন', micRecording:'শুনছি... আবার চাপলে থামবে',
  micUnsupported:'এই ব্রাউজারে ভয়েস টাইপিং সমর্থিত নয়, Chrome ব্যবহার করুন',
  micDenied:'মাইক্রোফোন অনুমতি দেওয়া হয়নি', addedOk:'যোগ করা হয়েছে', users:'জন', saveBtn:'সংরক্ষণ',
  nameLbl:'নাম', kksLbl:'KKS কোড', toolNameLbl:'টুলের নাম'
};
function t(k){ return T[k] || k; }

const LS = {
  get(k,f){ try{ const v=localStorage.getItem(k); return v? JSON.parse(v): f; }catch(e){ return f; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function bnum(input){ if(input===null||input===undefined) return ''; return String(input).replace(/[0-9]/g, d=>BN_DIGITS[+d]); }

const STATE = {
  session:null, screen:'boot', editingRecId:null, toastTimer:null,
  equipment:[], tools:[], records:[], users:[],
  loaded:false
};

const API = {
  baseUrl: localStorage.getItem('mr_api_url') || '',
  token: localStorage.getItem('mr_token') || '',
  status:'off',
  setStatus(s){ this.status=s; const el=document.getElementById('syncStatusDot'); if(el){ el.className='sync-dot '+(s==='on'?'on':(s==='busy'?'busy':'off')); } },
  async call(action, payload={}){
    this.setStatus('busy');
    try{
      const body = JSON.stringify(Object.assign({action, token:this.token}, payload));
      const res = await fetch(this.baseUrl, {method:'POST', body});
      if(!res.ok) throw new Error('http_'+res.status);
      const data = await res.json();
      this.setStatus('on');
      return data;
    }catch(err){ this.setStatus('error'); throw err; }
  },
  async login(username, password){
    const res = await this.call('login', {username, password});
    if(res.ok){ this.token = res.token; localStorage.setItem('mr_token', res.token); }
    return res;
  },
  async logout(){ try{ await this.call('logout'); }catch(e){} this.token=''; localStorage.removeItem('mr_token'); },
  setBaseUrl(url){ this.baseUrl = url.trim(); localStorage.setItem('mr_api_url', this.baseUrl); },
  changeServer(){
    localStorage.removeItem('mr_api_url'); localStorage.removeItem('mr_token');
    this.baseUrl=''; this.token=''; STATE.session=null; STATE.screen='setup'; render();
  }
};

function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = isErr? 'show err':'show';
  clearTimeout(STATE.toastTimer);
  STATE.toastTimer = setTimeout(()=>{ el.className=''; }, 2600);
}

function render(){

  if(STATE.screen==='boot'){ root.innerHTML = renderBootScreen(); return; }
  if(STATE.screen==='setup'){ root.innerHTML = renderSetupScreen(); bindSetupScreen(); return; }
  if(!STATE.session){ root.innerHTML = renderLogin(); bindLogin(); return; }

  let body = '';
  if(STATE.screen==='new') body = renderNewRecord();
  else if(STATE.screen==='records') body = renderRecords();
  else if(STATE.screen==='stats') body = renderStats();
  else if(STATE.screen==='settings') body = renderSettings();

function bindNewRecord(){
  const byId = id=>document.getElementById(id);
  if(byId('fDate')) byId('fDate').onchange = e=>{ recDraft.date = e.target.value; };

  const equipSel = byId('fEquip');
  if(equipSel) equipSel.onchange = e=>{
    if(e.target.value==='__new__'){
      openNewEquipModal(newEq=>{
        recDraft.equipment_id = newEq.id; recDraft.equipment_name = newEq.name; recDraft.kks = newEq.kks;
        render();
      });
      e.target.value = recDraft.equipment_id || '';
      return;
    }
    recDraft.equipment_id = e.target.value;
    const opt = e.target.selectedOptions[0];
    recDraft.equipment_name = opt ? opt.textContent : '';
    recDraft.kks = opt ? (opt.getAttribute('data-kks')||'') : '';
    render();
  };
  if(byId('fKks')) byId('fKks').oninput = e=>{ recDraft.kks = e.target.value; };
  if(byId('fDesc')) byId('fDesc').oninput = e=>{ recDraft.description = e.target.value; };

  document.querySelectorAll('[data-tool]').forEach(el=>{
    el.onclick = ()=>{
      const name = el.getAttribute('data-tool');
      const idx = recDraft.tools.indexOf(name);
      if(idx>=0) recDraft.tools.splice(idx,1); else recDraft.tools.push(name);
      render();
    };
  });
  const addToolChip = byId('btnAddToolChip');
  if(addToolChip) addToolChip.onclick = ()=>{
    openNewToolModal(newTool=>{
      recDraft.tools.push(newTool.name);
      render();
    });
  };

  const uploadBox = byId('uploadBox');
  const fileInput = byId('fileImg');
  if(uploadBox) uploadBox.onclick = ()=> fileInput.click();
  if(fileInput) fileInput.onchange = e=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    byId('uploadStatus').innerHTML = `<div class="info-box">${t('uploading')}</div>`;
    let remaining = files.length;
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = async ev=>{
        try{
          const res = await API.call('uploadImage', {
            base64: ev.target.result,
            filename: `MR_${recDraft.date}_${Date.now()}.jpg`,
            mimeType: file.type || 'image/jpeg'
          });
          if(res.ok){ recDraft.photos.push(res.url); }
          else { toast(t('networkErr'), true); }
        }catch(err){ toast(t('networkErr'), true); }
        remaining--;
        if(remaining===0) render();
      };
      reader.readAsDataURL(file);
    });
  };
  document.querySelectorAll('[data-photo-del]').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.getAttribute('data-photo-del'));
      recDraft.photos.splice(i,1);
      render();
    };
  });

  const micBtn = byId('btnMic');
  if(micBtn) micBtn.onclick = ()=> toggleVoiceInput();

  const saveBtn = byId('btnSaveRec');
  if(saveBtn) saveBtn.onclick = doSaveRecord;
  const cancelBtn = byId('btnCancelEdit');
  if(cancelBtn) cancelBtn.onclick = ()=>{ STATE.editingRecId=null; recDraft=null; STATE.screen='records'; render(); };
}

/* ---------- Voice input (free, browser-native Web Speech API, Bangla) ---------- */
function toggleVoiceInput(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const statusEl = document.getElementById('micStatus');
  const micBtn = document.getElementById('btnMic');
  if(!SR){ if(statusEl) statusEl.textContent = t('micUnsupported'); return; }

  if(recognizing){
    if(recognizer) recognizer.stop();
    return;
  }
  recognizer = new SR();
  recognizer.lang = 'bn-BD';
  recognizer.interimResults = true;
  recognizer.continuous = true;

  let baseText = recDraft.description || '';
  if(baseText && !baseText.endsWith(' ')) baseText += ' ';

  recognizer.onstart = ()=>{
    recognizing = true;
    if(micBtn) micBtn.classList.add('rec');
    if(statusEl) statusEl.textContent = t('micRecording');
  };
  recognizer.onresult = (ev)=>{
    let finalTxt = '', interimTxt = '';
    for(let i=0;i<ev.results.length;i++){
      const res = ev.results[i];
      if(res.isFinal) finalTxt += res[0].transcript;
      else interimTxt += res[0].transcript;
    }
    const ta = document.getElementById('fDesc');
    const combined = baseText + finalTxt + interimTxt;
    if(ta) ta.value = combined;
    recDraft.description = baseText + finalTxt;
  };
  recognizer.onerror = (ev)=>{
    if(statusEl) statusEl.textContent = ev.error==='not-allowed' ? t('micDenied') : '';
  };
  recognizer.onend = ()=>{
    recognizing = false;
    if(micBtn) micBtn.classList.remove('rec');
    if(statusEl) statusEl.textContent = '';
    const ta = document.getElementById('fDesc');
    if(ta) recDraft.description = ta.value;
  };
  try{ recognizer.start(); }catch(e){ /* already started */ }
}

async function doSaveRecord(){
  document.getElementById('formErrBox').innerHTML = '';
  if(!recDraft.date || (!recDraft.equipment_name && !recDraft.equipment_id) || !recDraft.description.trim()){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('fillRequired')}</div>`;
    return;
  }
  const saveBtn = document.getElementById('btnSaveRec');
  if(saveBtn) saveBtn.disabled = true;
  try{
    const res = await API.call('saveRecord', {record: recDraft});
    if(!res.ok){
      if(res.error==='unauthorized'){ toast(t('sessionExpired'), true); STATE.session=null; render(); }
      else document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('networkErr')}</div>`;
      if(saveBtn) saveBtn.disabled = false;
      return;
    }
    const idx = STATE.records.findIndex(r=>r.id===res.record.id);
    if(idx>=0) STATE.records[idx] = res.record; else STATE.records.push(res.record);
    toast(recDraft.id ? t('updatedOk') : t('savedOk'));
    STATE.editingRecId = null; recDraft = null;
    STATE.screen = 'records'; render();
  }catch(e){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('networkErr')}</div>`;
    if(saveBtn) saveBtn.disabled = false;
  }
}

  const r = STATE.records.find(x=>x.id===id);
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `<div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">${bnum(r.date)} — ${esc(r.equipment_name)}</div>
    <div class="modal-sub">${r.kks? 'KKS: '+esc(r.kks):''}</div>
    <div class="info-box">${esc(r.description)}</div>
    ${r.tools && r.tools.length? `<div class="chipwrap">${r.tools.map(tl=>`<span class="chip active">${esc(tl)}</span>`).join('')}</div>`:''}
    <div class="divider"></div>
    <div class="emp-row"><div style="flex:1;">👤 ${esc(r.submitted_by)}</div></div>
    ${r.photos && r.photos.length? `<div class="thumbgrid">${r.photos.map(p=>`<a href="${p}" target="_blank"><img src="${p}"></a>`).join('')}</div>`:''}
    <button class="btn btn-primary btn-block" id="btnCloseModal" style="margin-top:14px;">${t('close')}</button>
  </div>`;
  document.body.appendChild(modal);
  modal.onclick = e=>{ if(e.target===modal) modal.remove(); };
  modal.querySelector('#btnCloseModal').onclick = ()=> modal.remove();
}
function openDeleteConfirm(id){
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `<div class="modal-box" style="border-radius:18px;">
    <div class="modal-title">${t('del')}?</div>
    <div class="modal-sub">${t('confirmDelete')}</div>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-outline btn-block" id="btnNo">${t('cancel')}</button>
      <button class="btn btn-danger btn-block" style="background:var(--rust);color:#fff;" id="btnYes">${t('yesDelete')}</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#btnNo').onclick = ()=> modal.remove();
  modal.querySelector('#btnYes').onclick = async ()=>{
    try{
      const res = await API.call('deleteRecord', {id});
      if(res.ok){ STATE.records = STATE.records.filter(r=>r.id!==id); toast(t('deletedOk')); }
      else toast(t('networkErr'), true);
    }catch(e){ toast(t('networkErr'), true); }
    modal.remove(); render();
  };
}

/* =========================================================
   STATS — records per user
   ========================================================= */
function renderStats(){
  const today = new Date().toISOString().slice(0,10);
  const counts = {};
  STATE.records.forEach(r=>{ counts[r.submitted_by] = (counts[r.submitted_by]||0)+1; });
  const maxCount = Math.max(1, ...Object.values(counts));
  const knownUsers = STATE.users.length? STATE.users.map(u=>u.username) : Object.keys(counts);
  const rows = knownUsers.map(u=>({user:u, count:counts[u]||0})).sort((a,b)=>b.count-a.count);
  const totalToday = STATE.records.filter(r=>r.date===today).length;

  return `
  <div class="section-head"><div><h2>${t('statsTitle')}</h2></div></div>
  <div class="stat-row">
    <div class="stat-box"><div class="sn mono">${bnum(STATE.records.length)}</div><div class="sl">${t('totalRecords')}</div></div>
    <div class="stat-box"><div class="sn mono">${bnum(totalToday)}</div><div class="sl">${t('totalToday')}</div></div>
  </div>
  <div class="card">
    <div class="card-title">${t('statsTitle')}</div>
    ${rows.length===0? `<div class="empty" style="padding:20px;"><p>${t('noData')}</p></div>` :
      rows.map(row=>`
      <div class="userstat-row">
        <div class="userstat-name">${esc(row.user)}</div>
        <div class="userstat-bar"><div class="userstat-bar-fill" style="width:${(row.count/maxCount*100).toFixed(0)}%"></div></div>
        <div class="userstat-count mono">${bnum(row.count)}</div>
      </div>`).join('')
    }
  </div>`;
}
function bindStats(){}

/* =========================================================
   SETTINGS — equipment list, tools list, account
   ========================================================= */
let settingsTab = 'equipment';
function renderSettings(){
  const tabs = [
    {id:'equipment', label:t('equipMgmt')},
    {id:'tools', label:t('toolMgmt')},
    {id:'account', label:t('account')}
  ];
  return `
  <div class="section-head"><div><h2>${t('settingsTitle')}</h2></div></div>
  <div class="pill-scroll">${tabs.map(tb=>`<div class="pill ${settingsTab===tb.id?'active':''}" data-stab="${tb.id}">${tb.label}</div>`).join('')}</div>
  ${settingsTab==='equipment'? renderEquipSettings() : ''}
  ${settingsTab==='tools'? renderToolSettings() : ''}
  ${settingsTab==='account'? renderAccountSettings() : ''}
  `;
}
function renderEquipSettings(){
  return `<div class="card">
    <div class="card-title">${t('equipMgmt')}</div>
    ${STATE.equipment.map(e=>`
      <div class="emp-row" style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--paper-2);">
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">${esc(e.name)}</div>
          <div style="font-size:11px;color:var(--ink-soft);">${e.kks? 'KKS: '+esc(e.kks):''}</div>
        </div>
      </div>`).join('')}
    <button class="btn btn-amber btn-block" id="btnAddEquipSettings" style="margin-top:10px;">${t('addEquip')}</button>
  </div>`;
}
function renderToolSettings(){
  return `<div class="card">
    <div class="card-title">${t('toolMgmt')}</div>
    <div class="chipwrap">${STATE.tools.map(tl=>`<span class="chip">${esc(tl.name)}</span>`).join('')}</div>
    <button class="btn btn-amber btn-block" id="btnAddToolSettings" style="margin-top:10px;">${t('addTool')}</button>
  </div>`;
}
function renderAccountSettings(){
  return `<div class="card">
    <div class="card-title">${t('account')}</div>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">${t('loggedInAs')}: <b>${esc(STATE.session.username)}</b></p>
    <div class="field"><label>${t('newPw')}</label><input type="password" id="pwNew"></div>
    <button class="btn btn-primary btn-block" id="btnSavePw">${t('saveBtn')}</button>
  </div>
  <div class="card">
    <div class="card-title">Server</div>
    <button class="btn btn-outline btn-block" id="btnChangeServer">${t('editApiUrl')}</button>
  </div>`;
}
function bindSettings(){
  document.querySelectorAll('[data-stab]').forEach(el=>{ el.onclick = ()=>{ settingsTab = el.getAttribute('data-stab'); render(); }; });
  const addEquipBtn = document.getElementById('btnAddEquipSettings');
  if(addEquipBtn) addEquipBtn.onclick = ()=> openNewEquipModal(()=> render());
  const addToolBtn = document.getElementById('btnAddToolSettings');
  if(addToolBtn) addToolBtn.onclick = ()=> openNewToolModal(()=> render());
  const savePwBtn = document.getElementById('btnSavePw');
  if(savePwBtn) savePwBtn.onclick = async ()=>{
    const pw = document.getElementById('pwNew').value.trim();
    if(!pw) return;
    try{
      const res = await API.call('changePassword', {newPassword: pw});
      if(res.ok) toast(t('pwChanged')); else toast(t('networkErr'), true);
    }catch(e){ toast(t('networkErr'), true); }
  };
  const changeServerBtn = document.getElementById('btnChangeServer');
  if(changeServerBtn) changeServerBtn.onclick = ()=> API.changeServer();
}

/* ---------- boot sequence ---------- */
(async function boot(){
  STATE.screen = 'boot'; render();
  if(!API.baseUrl){ STATE.screen='setup'; render(); return; }
  if(API.token){
    try{
      const res = await API.call('verifySession');
      if(res.ok){
        STATE.session = {username: res.username};
        await loadBootstrap();
        STATE.screen='new'; render();
        return;
      }
    }catch(e){ /* fall through */ }
  }
  STATE.screen = 'login'; render();
})();
</script>
