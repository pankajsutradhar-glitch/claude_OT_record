<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F2E2C">
<title>OT_Record — অতিরিক্ত কর্মঘন্টা ব্যবস্থাপনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
:root{
  --ink:#0F2E2C;
  --ink-2:#163F3B;
  --paper:#F6F4EE;
  --paper-2:#EDEAE1;
  --line:#D9D4C6;
  --amber:#C77C2C;
  --amber-2:#E0954A;
  --rust:#B0483B;
  --moss:#4B7A5A;
  --white:#FFFFFF;
  --ink-soft:#5B6A66;
  --shadow: 0 1px 2px rgba(15,46,44,.06), 0 4px 14px rgba(15,46,44,.07);
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(199,124,44,.08), transparent 60%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}
#root{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:82px;}

/* Top bar */
.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--amber),var(--rust));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;
}
.brand-title{font-size:15px;font-weight:600;line-height:1.15;}
.brand-sub{font-size:10.5px;color:#9FC2B8;letter-spacing:.04em;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}
.icon-btn:active{background:rgba(255,255,255,.18);}

main{padding:16px 16px 24px;}

/* Cards */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card-title .tag{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--amber);
  background:rgba(199,124,44,.1);border:1px solid rgba(199,124,44,.25);
  padding:2px 6px;border-radius:5px;letter-spacing:.05em;
}

/* Form */
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.01em;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#fff;}
textarea{resize:vertical;min-height:64px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;
  cursor:pointer;font-family:inherit;transition:transform .06s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:var(--rust);border:1.5px solid rgba(176,72,59,.3);}
.btn-ghost{background:rgba(15,46,44,.05);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

/* Bottom nav */
.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;
  background:var(--ink);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.15);
}
.navitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;color:#7FA79C;cursor:pointer;
  font-size:10px;font-weight:600;letter-spacing:.01em;
}
.navitem .ni-ico{font-size:18px;line-height:1;}
.navitem.active{color:var(--amber-2);}

/* chips / badges */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-amber{background:rgba(199,124,44,.12);color:var(--amber);}
.badge-moss{background:rgba(75,122,90,.12);color:var(--moss);}
.badge-rust{background:rgba(176,72,59,.12);color:var(--rust);}
.badge-gray{background:var(--paper-2);color:var(--ink-soft);}

/* list rows */
.sheet-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.sheet-card .date-block{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);font-weight:600;
}
.sheet-card h4{margin:2px 0 6px;font-size:14.5px;font-weight:600;}
.sheet-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.sheet-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.sheet-actions{display:flex;gap:8px;margin-top:10px;}

/* employee checklist */
.emp-row{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--paper-2);
}
.emp-row:last-child{border-bottom:none;}
.emp-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;
}
.emp-check.checked{background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:13px;}
.emp-name{font-size:14px;font-weight:600;flex:1;}
.emp-desig{font-size:11px;color:var(--ink-soft);}

.slot-adjust{
  margin-top:8px;padding:10px;background:var(--paper);border-radius:10px;border:1px dashed var(--line);
}
.slot-adjust-title{font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}

/* time slot editor */
.slot-item{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;
  background:var(--paper);border-radius:10px;
}
.slot-item span{font-size:12px;color:var(--ink-soft);}

/* select-all bar */
.selectall-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 10px;background:var(--paper);border-radius:10px;margin-bottom:8px;
  border:1px dashed var(--line);
}
.selectall-bar span{font-size:12.5px;font-weight:600;color:var(--ink-soft);}

/* login / connect */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(15,46,44,.15);border:1px solid var(--line);}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--rust));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:22px;margin:0 auto 16px;}
.role-toggle{display:flex;background:var(--paper-2);border-radius:10px;padding:3px;margin-bottom:18px;}
.role-toggle button{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.role-toggle button.active{background:var(--ink);color:var(--paper);}
.spin{width:34px;height:34px;border:3px solid var(--paper-2);border-top-color:var(--amber);border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* summary table */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--paper-2);}
th{background:var(--paper-2);font-weight:600;color:var(--ink-soft);font-size:10.5px;position:sticky;top:0;}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:right;font-weight:600;z-index:1;}
th:first-child{background:var(--paper-2);z-index:2;}
tr:nth-child(even) td{background:#FBFAF7;}
tr:nth-child(even) td:first-child{background:#FBFAF7;}
.cell-x{color:#C7C2B4;}
.cell-h{color:var(--moss);font-weight:600;}

/* empty state */
.empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
.empty .ei{font-size:38px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13.5px;margin:4px 0;}

/* toast */
#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:30px;
  font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:88%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--rust);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,46,44,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.center{align-items:center;padding:20px;}
.modal-box{
  background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  animation:slideup .22s ease;
}
.modal-bg.center .modal-box{border-radius:18px;max-width:400px;animation:popin .18s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes popin{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}

/* segmented lang */
.lang-toggle{display:flex;gap:6px;}
.lang-toggle button{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:18px;font-weight:700;margin:0;font-family:'Space Grotesk',sans-serif;}
.section-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.divider{height:1px;background:var(--line);margin:14px 0;}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat-box .sn{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--ink);}
.stat-box .sl{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.img-thumb{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line);display:block;}
.upload-box{
  border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;background:var(--paper);font-size:12.5px;color:var(--ink-soft);
}

.search-box{position:relative;margin-bottom:14px;}
.search-box input{padding-left:36px;}
.search-box::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}

.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.pill{flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

::-webkit-scrollbar{height:5px;width:5px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}

.warn-box{background:rgba(176,72,59,.08);border:1px solid rgba(176,72,59,.25);color:var(--rust);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;font-weight:500;}
.info-box{background:rgba(75,122,90,.08);border:1px solid rgba(75,122,90,.25);color:var(--moss);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}

/* cloud sync */
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.sync-dot.on{background:var(--moss);box-shadow:0 0 0 3px rgba(75,122,90,.15);}
.sync-dot.off{background:#C7C2B4;}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.steps-box{font-size:12px;color:var(--ink-soft);line-height:1.85;background:var(--paper);border-radius:10px;padding:12px 14px;}
.steps-box b{color:var(--ink);}
.steps-box a{color:var(--amber);text-decoration:none;font-weight:600;}
.topbar-sync{display:flex;align-items:center;font-size:10px;color:#9FC2B8;}
</style>
</head>

/* ---------- time utils ---------- */
function toMin(hhmm){
  if(!hhmm) return null;
  const [h,m] = String(hhmm).split(':').map(Number);
  return h*60+m;
}
function durationHours(start, end){
  let s = toMin(start), e = toMin(end);
  if(s===null||e===null) return 0;
  if(e <= s) e += 24*60;
  return +( (e-s)/60 ).toFixed(2);
}
function fmtHM(hhmm){ return hhmm || '—'; }
function intervalsOverlap(aS,aE,bS,bE){
  let as=toMin(aS), ae=toMin(aE), bs=toMin(bS), be=toMin(bE);
  if(ae<=as) ae+=24*60;
  if(be<=bs) be+=24*60;
  return as < be && bs < ae;
}
function findConflicts(employeeId, date, newIntervals, excludeSheetId){
  const conflicts = [];
  STATE.sheets.forEach(sh=>{
    if(sh.id === excludeSheetId) return;
    if(sh.date !== date) return;
    const empEntry = sh.employees.find(e=>e.employee_id===employeeId);
    if(!empEntry) return;
    empEntry.adjustments.forEach(adj=>{
      newIntervals.forEach(ni=>{
        if(intervalsOverlap(ni.start, ni.end, adj.actual_start, adj.actual_end)){
          conflicts.push({sheet:sh, existing:adj});
        }
      });
    });
  });
  return conflicts;
}

const DB = {
  clientId: localStorage.getItem('otr_clientid') || '',
  apiKey: localStorage.getItem('otr_apikey') || '',
  spreadsheetId: localStorage.getItem('otr_ssid') || '',
  accessToken: '',
  tokenClient: null,
  connected: false,
  status: 'off', // off | connecting | on | busy | error
  lastSync: localStorage.getItem('otr_lastsync') || '',
  pickerLoaded: false,

  setStatus(s){ this.status = s; const el=document.getElementById('syncStatusDot'); if(el){ el.className='sync-dot '+(s==='on'?'on':(s==='busy'||s==='connecting'?'busy':'off')); } },

  ensureTokenClient(cb){
    if(!window.google || !google.accounts || !google.accounts.oauth2){
      toast(t('gsiNotLoaded'), true); return;
    }
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: this.clientId,
      scope: SCOPES,
      callback: (resp)=>{
        if(resp.error){ this.setStatus('error'); toast(t('cloudConnectFailed')||'Connect failed', true); return; }
        this.accessToken = resp.access_token;
        cb && cb();
      }
    });
    this.tokenClient.requestAccessToken({prompt:''});
  },

  async apiFetch(url, opts={}){
    opts.headers = Object.assign({}, opts.headers, {Authorization:'Bearer '+this.accessToken});
    const res = await fetch(url, opts);
    if(res.status===401){ this.setStatus('error'); throw new Error('auth_expired'); }
    if(!res.ok){ const txt = await res.text(); throw new Error('http_'+res.status+': '+txt.slice(0,200)); }
    return res;
  },

  connectAccount(){
    if(!this.clientId || !this.apiKey){ toast(t('needClientId'), true); return; }
    this.setStatus('connecting');
    this.ensureTokenClient(async ()=>{
      this.connected = true;
      this.setStatus('on');
      if(this.spreadsheetId){
        await this.ensureTabsAndSeed();
        await this.pullAll();
        finishBootAfterConnect();
      } else {
        STATE.screen = 'chooser';
        render();
      }
    });
  },

  async createSpreadsheet(){
    DB.setStatus('busy');
    try{
      const res = await DB.apiFetch('https://sheets.googleapis.com/v4/spreadsheets', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({properties:{title:'OT_Record Database'}})
      });
      const data = await res.json();
      DB.spreadsheetId = data.spreadsheetId;
      localStorage.setItem('otr_ssid', DB.spreadsheetId);
      await DB.ensureTabsAndSeed();
      await DB.pullAll();
      DB.setStatus('on');
      finishBootAfterConnect();
    }catch(e){ DB.setStatus('error'); toast(String(e.message||e), true); }
  },

  openPicker(){
    if(!DB.apiKey){ toast(t('needClientId'), true); return; }
    if(!DB.pickerLoaded){
      gapi.load('picker', ()=>{ DB.pickerLoaded=true; DB.showPicker(); });
    } else DB.showPicker();
  },
  showPicker(){
    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setMode(google.picker.DocsViewMode.LIST);
    const picker = new google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(DB.accessToken)
      .setDeveloperKey(DB.apiKey)
      .setCallback(DB.pickerCallback)
      .build();
    picker.setVisible(true);
  },
  async pickerCallback(data){
    if(data.action === google.picker.Action.PICKED){
      const doc = data.docs[0];
      DB.spreadsheetId = doc.id;
      localStorage.setItem('otr_ssid', DB.spreadsheetId);
      DB.setStatus('busy');
      try{
        await DB.ensureTabsAndSeed();
        await DB.pullAll();
        DB.setStatus('on');
        finishBootAfterConnect();
      }catch(e){ DB.setStatus('error'); toast(String(e.message||e), true); }
    }
  },

  async ensureTabsAndSeed(){
    const metaRes = await DB.apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${DB.spreadsheetId}?fields=sheets.properties.title`);
    const meta = await metaRes.json();
    const existing = (meta.sheets||[]).map(s=>s.properties.title);
    const requests = [];
    Object.values(TABS).forEach(tab=>{
      if(!existing.includes(tab.name)) requests.push({addSheet:{properties:{title:tab.name}}});
    });
    if(requests.length){
      await DB.apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${DB.spreadsheetId}:batchUpdate`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({requests})
      });
    }
    for(const key of Object.keys(TABS)){
      if(!existing.includes(TABS[key].name)){
        await DB.writeFullTab(TABS[key].name, seedRowsFor(key));
      }
    }
  },

  async writeFullTab(tabName, rows2D){
    const range = `${tabName}!A1`;
    await DB.apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${DB.spreadsheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({range, majorDimension:'ROWS', values: rows2D})
    });
  },
  async clearTabBody(tabName){
    const range = `${tabName}!A2:Z20000`;
    await DB.apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${DB.spreadsheetId}/values/${encodeURIComponent(range)}:clear`, {method:'POST'});
  },
  async readTab(key){
    const tab = TABS[key];
    const range = `${tab.name}!A1:Z20000`;
    const res = await DB.apiFetch(`https://sheets.googleapis.com/v4/spreadsheets/${DB.spreadsheetId}/values/${encodeURIComponent(range)}?valueRenderOption=UNFORMATTED_VALUE`);
    const data = await res.json();
    return data.values || [tab.headers];
  },
  async pushTab(key, rows2D){
    DB.setStatus('busy');
    try{
      await DB.clearTabBody(TABS[key].name);
      await DB.writeFullTab(TABS[key].name, [TABS[key].headers, ...rows2D]);
      DB.lastSync = new Date().toISOString();
      localStorage.setItem('otr_lastsync', DB.lastSync);
      DB.setStatus('on');
    }catch(e){ DB.setStatus('error'); toast(t('tokenExpired'), true); throw e; }
  },

  async pushUsers(){ await DB.pushTab('users', STATE.users.map(u=>[u.username,u.password,u.role])); },
  async pushEmployees(){ await DB.pushTab('employees', STATE.employees.map(e=>[e.id,e.name,e.designation,!!e.active])); },
  async pushDivisions(){ await DB.pushTab('divisions', STATE.divisions.map(d=>[d.id,d.name_bn,d.name_en,!!d.is_default,!!d.active])); },
  async pushSheets(){
    await DB.pushTab('otsheets', STATE.sheets.map(s=>[
      s.id, "'"+s.date, s.division_id, s.work_description||'', s.remarks||'',
      s.image||'', JSON.stringify(s.slots||[]), JSON.stringify(s.employees||[]),
      s.created_by||'', s.created_at||'', s.updated_by||'', s.updated_at||''
    ]));
  },

  async pullAll(){
    DB.setStatus('busy');
    try{
      const [u,e,d,s] = await Promise.all([
        DB.readTab('users'), DB.readTab('employees'), DB.readTab('divisions'), DB.readTab('otsheets')
      ]);
      STATE.users = u.slice(1).filter(r=>r && r.length && r[0]!=='').map(r=>({username:r[0],password:String(r[1]),role:r[2]}));
      STATE.employees = e.slice(1).filter(r=>r && r.length && r[0]!=='').map(r=>({id:r[0],name:r[1],designation:r[2]||'',active: r[3]===true}));
      STATE.divisions = d.slice(1).filter(r=>r && r.length && r[0]!=='').map(r=>({id:r[0],name_bn:r[1],name_en:r[2],is_default: r[3]===true, active:r[4]===true}));
      STATE.sheets = s.slice(1).filter(r=>r && r.length && r[0]!=='').map(r=>({
        id:r[0], date:String(r[1]).replace(/^'/,''), division_id:r[2], work_description:r[3]||'', remarks:r[4]||'',
        image:r[5]||'', slots: safeParseJson(r[6],[]), employees: safeParseJson(r[7],[]),
        created_by:r[8]||'', created_at:r[9]||'', updated_by:r[10]||'', updated_at:r[11]||''
      }));
      STATE.loaded = true;
      DB.setStatus('on');
    }catch(e){ DB.setStatus('error'); throw e; }
  },

  async uploadImage(base64Data, filename, mimeType){
    const folderId = await DB.getOrCreateFolder('OT_Record_Images');
    const boundary = 'otrsync_' + Math.random().toString(36).slice(2);
    const metadata = {name: filename, mimeType: mimeType, parents:[folderId]};
    const pureBase64 = base64Data.indexOf(',')>=0 ? base64Data.split(',').pop() : base64Data;
    const multipart =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n`+
      `--${boundary}\r\nContent-Type: ${mimeType}\r\nContent-Transfer-Encoding: base64\r\n\r\n${pureBase64}\r\n`+
      `--${boundary}--`;
    const res = await DB.apiFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method:'POST', headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body: multipart
    });
    const data = await res.json();
    await DB.apiFetch(`https://www.googleapis.com/drive/v3/files/${data.id}/permissions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({role:'reader', type:'anyone'})
    });
    return 'https://drive.google.com/uc?export=view&id='+data.id;
  },
  async getOrCreateFolder(name){
    if(DB._folderId) return DB._folderId;
    const q = encodeURIComponent(`name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
    const listRes = await DB.apiFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
    const list = await listRes.json();
    if(list.files && list.files.length>0){ DB._folderId = list.files[0].id; return DB._folderId; }
    const createRes = await DB.apiFetch('https://www.googleapis.com/drive/v3/files', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, mimeType:'application/vnd.google-apps.folder'})
    });
    const created = await createRes.json();
    DB._folderId = created.id;
    return DB._folderId;
  },

  disconnect(){
    this.connected=false; this.accessToken=''; this.setStatus('off');
  },
  changeSpreadsheet(){
    localStorage.removeItem('otr_ssid');
    DB.spreadsheetId = '';
    STATE.screen = 'chooser';
    render();
  }
};

    ['emp3','জনাব মোঃ আলাল উদ্দিন','সিনিঃ টেকনিশিয়ান',true],
    ['emp4','জনাব মাসুদ রানা খান','জুনিঃ টেকনিশিয়ান',true],
    ['emp5','জনাব মমিন খন্দকার','জুনিঃ টেকনিশিয়ান',true],
    ['emp6','সুমন হোসেন','জুনিঃ টেকনিশিয়ান',true]
  ];
  if(key==='divisions') return [
    ['div1','যান্ত্রিক, জিটি, নর্থ','Mechanical, GT, North', true, true],
    ['div2','যান্ত্রিক, এসটি, নর্থ','Mechanical, ST, North', true, true]

  return [];
}

function finishBootAfterConnect(){
  const savedSession = LS.get('otr_session', null);
  if(savedSession && STATE.users.find(u=>u.username===savedSession.username && u.role===savedSession.role)){
    STATE.session = savedSession;
    STATE.screen = 'new';
  } else {
    STATE.session = null;
    STATE.screen = 'login';
  }
  render();
}

/* ---------- render root ---------- */
function render(){
  const root = document.getElementById('root');
  document.documentElement.lang = STATE.lang;

  if(STATE.screen==='boot'){ root.innerHTML = renderBootScreen(); bindBootScreen(); return; }
  if(STATE.screen==='setup'){ root.innerHTML = renderSetupScreen(); bindSetupScreen(); return; }
  if(STATE.screen==='connect'){ root.innerHTML = renderConnectScreen(); bindConnectScreen(); return; }
  if(STATE.screen==='chooser'){ root.innerHTML = renderChooserScreen(); bindChooserScreen(); return; }

  if(!STATE.session){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  let body = '';
  if(STATE.screen==='new') body = renderNewSheet();
  else if(STATE.screen==='records') body = renderRecords();
  else if(STATE.screen==='summary') body = renderSummary();
  else if(STATE.screen==='settings') body = renderSettings();
  else body = renderNewSheet();

  root.innerHTML = `
    ${renderTopbar()}

    return;
  }
  STATE.session = {username:found.username, role:found.role};

  STATE.screen = 'new';
  render();
}

function bindScreenSpecific(){

  else if(STATE.screen==='records') bindRecords();
  else if(STATE.screen==='summary') bindSummary();
  else if(STATE.screen==='settings') bindSettings();

function bindNewSheet(){
  const byId = id=>document.getElementById(id);
  if(byId('fDate')) byId('fDate').onchange = e=>{ sheetDraft.date = e.target.value; };
  if(byId('fDivision')) byId('fDivision').onchange = e=>{ sheetDraft.division_id = e.target.value; };
  if(byId('fWorkDesc')) byId('fWorkDesc').oninput = e=>{ sheetDraft.work_description = e.target.value; };
  if(byId('fRemarks')) byId('fRemarks').oninput = e=>{ sheetDraft.remarks = e.target.value; };

  document.querySelectorAll('[data-slot-start]').forEach(el=>{
    el.onchange = e=>{ sheetDraft.slots.find(s=>s.id===el.getAttribute('data-slot-start')).start = e.target.value; };
  });
  document.querySelectorAll('[data-slot-end]').forEach(el=>{
    el.onchange = e=>{ sheetDraft.slots.find(s=>s.id===el.getAttribute('data-slot-end')).end = e.target.value; };
  });
  document.querySelectorAll('[data-slot-del]').forEach(el=>{
    el.onclick = ()=>{
      const sid = el.getAttribute('data-slot-del');
      sheetDraft.slots = sheetDraft.slots.filter(s=>s.id!==sid);
      sheetDraft.employees.forEach(e=>{ e.adjustments = e.adjustments.filter(a=>a.slot_id!==sid); });
      render();
    };
  });
  const addSlotBtn = byId('btnAddSlot');
  if(addSlotBtn) addSlotBtn.onclick = ()=>{
    const newSlot = {id:uid('slot'), start:'16:00', end:'18:00'};
    sheetDraft.slots.push(newSlot);
    sheetDraft.employees.forEach(e=>{ e.adjustments.push({slot_id:newSlot.id, actual_start:newSlot.start, actual_end:newSlot.end}); });
    render();
  };

  const selectAllBtn = byId('btnSelectAll');
  if(selectAllBtn) selectAllBtn.onclick = ()=>{
    const emps = STATE.employees.filter(e=>e.active);
    const allSelected = emps.every(e=> sheetDraft.employees.find(x=>x.employee_id===e.id));
    if(allSelected){
      sheetDraft.employees = [];
    } else {
      emps.forEach(e=>{
        if(!sheetDraft.employees.find(x=>x.employee_id===e.id)){
          sheetDraft.employees.push({
            employee_id: e.id,
            adjustments: sheetDraft.slots.map(s=>({slot_id:s.id, actual_start:s.start, actual_end:s.end}))
          });
        }
      });
    }
    render();
  };

  document.querySelectorAll('[data-emp-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const eid = el.getAttribute('data-emp-toggle');
      const idx = sheetDraft.employees.findIndex(x=>x.employee_id===eid);
      if(idx>=0){ sheetDraft.employees.splice(idx,1); }
      else {
        sheetDraft.employees.push({
          employee_id: eid,
          adjustments: sheetDraft.slots.map(s=>({slot_id:s.id, actual_start:s.start, actual_end:s.end}))
        });
      }
      render();
    };
  });
  document.querySelectorAll('[data-adj-start]').forEach(el=>{
    el.onchange = e=>{
      const [eid,sid] = el.getAttribute('data-adj-start').split('|');
      sheetDraft.employees.find(x=>x.employee_id===eid).adjustments.find(a=>a.slot_id===sid).actual_start = e.target.value;
    };
  });
  document.querySelectorAll('[data-adj-end]').forEach(el=>{
    el.onchange = e=>{
      const [eid,sid] = el.getAttribute('data-adj-end').split('|');
      sheetDraft.employees.find(x=>x.employee_id===eid).adjustments.find(a=>a.slot_id===sid).actual_end = e.target.value;
    };
  });

  const uploadBox = byId('uploadBox');
  const fileInput = byId('fileImg');
  if(uploadBox) uploadBox.onclick = ()=> fileInput.click();
  if(fileInput) fileInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev=>{
      byId('uploadStatus').innerHTML = `<div class="info-box">${t('uploading')}</div>`;
      try{
        const url = await DB.uploadImage(ev.target.result, `OT_${sheetDraft.date}_${Date.now()}.jpg`, file.type||'image/jpeg');
        sheetDraft.image = url;
        render();
      }catch(err){
        toast(t('tokenExpired'), true);
      }
    };
    reader.readAsDataURL(file);
  };

  const saveBtn = byId('btnSaveSheet');
  if(saveBtn) saveBtn.onclick = doSaveSheet;
  const cancelBtn = byId('btnCancelEdit');
  if(cancelBtn) cancelBtn.onclick = ()=>{ STATE.editingSheetId = null; sheetDraft = null; STATE.screen = 'records'; render(); };
}

async function doSaveSheet(){
  document.getElementById('formErrBox').innerHTML = '';
  if(!sheetDraft.date || !sheetDraft.division_id){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('fillRequired')}</div>`;
    return;
  }
  if(sheetDraft.employees.length===0){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('selectAtLeastOne')}</div>`;
    return;
  }
  const excludeId = sheetDraft.id;
  for(const emp of sheetDraft.employees){
    const intervals = emp.adjustments.map(a=>({start:a.actual_start, end:a.actual_end}));
    const conflicts = findConflicts(emp.employee_id, sheetDraft.date, intervals, excludeId);
    if(conflicts.length>0){
      const empObj = STATE.employees.find(x=>x.id===emp.employee_id);
      document.getElementById('formErrBox').innerHTML = `<div class="warn-box">⚠ ${empObj? empObj.name:''} — ${t('overlapErr')}</div>`;
      return;
    }
  }

  const saveBtn = document.getElementById('btnSaveSheet');
  if(saveBtn){ saveBtn.disabled = true; }

  try{
    if(sheetDraft.id){
      sheetDraft.updated_by = STATE.session.username;
      sheetDraft.updated_at = new Date().toISOString();
      const idx = STATE.sheets.findIndex(s=>s.id===sheetDraft.id);
      STATE.sheets[idx] = sheetDraft;
    } else {
      sheetDraft.id = uid('sheet');
      sheetDraft.created_by = STATE.session.username;
      sheetDraft.created_at = new Date().toISOString();
      STATE.sheets.push(sheetDraft);
    }
    await DB.pushSheets();
    toast(sheetDraft.updated_at ? t('updatedOk') : t('savedOk'));
    STATE.editingSheetId = null;
    sheetDraft = null;
    STATE.screen = 'records';
    render();
  }catch(e){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('tokenExpired')}</div>`;
    if(saveBtn) saveBtn.disabled = false;
  }
}

   RECORDS
   ========================================================= */
let recordsFilter = '';
function renderRecords(){
  const all = STATE.sheets.slice().sort((a,b)=> b.date.localeCompare(a.date) || String(b.created_at).localeCompare(String(a.created_at)));
  const filtered = recordsFilter ? all.filter(s=>{
    const div = STATE.divisions.find(d=>d.id===s.division_id);
    const divName = div ? (STATE.lang==='bn'?div.name_bn:div.name_en) : '';
    return (s.work_description||'').includes(recordsFilter) || (s.remarks||'').includes(recordsFilter) || divName.includes(recordsFilter) || s.date.includes(recordsFilter);
  }) : all;

  return `
  <div class="section-head">
    <div><h2>${t('recordsTitle')}</h2><div class="sub">${t('recordsSub')} · ${all.length} ${t('otSheetsCount')}</div></div>
  </div>
  <div class="search-box">
    <input type="text" id="recSearch" placeholder="${t('searchEmp')}" value="${recordsFilter}">
  </div>
  ${filtered.length===0? `
    <div class="empty">
      <div class="ei">🗂️</div>
      <p>${t('noRecords')}</p>
      <button class="btn btn-amber" id="btnGoNew" style="margin-top:10px;">${t('createFirst')}</button>
    </div>` :
    filtered.map(s=>renderSheetCard(s)).join('')
  }
  `;
}

function renderSheetCard(s){
  const div = STATE.divisions.find(d=>d.id===s.division_id);

    <div class="date-block">${s.date}</div>

function openViewModal(sheetId){
  const s = STATE.sheets.find(x=>x.id===sheetId);
  const div = STATE.divisions.find(d=>d.id===s.division_id);
  const divName = div ? (STATE.lang==='bn'?div.name_bn:div.name_en) : t('na');
  const empRows = s.employees.map(e=>{
    const emp = STATE.employees.find(x=>x.id===e.employee_id) || {name:'?',designation:''};
    const hrs = e.adjustments.reduce((sum,a)=>sum+durationHours(a.actual_start,a.actual_end),0);
    const times = e.adjustments.map(a=>`${fmtHM(a.actual_start)}–${fmtHM(a.actual_end)}`).join(', ');
    return `<div class="emp-row"><div style="flex:1;">
      <div class="emp-name">${emp.name}</div>
      <div class="emp-desig">${emp.designation} · ${times}</div>
    </div><span class="badge badge-moss">${hrs.toFixed(2)}${t('hours')}</span></div>`;
  }).join('');

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-handle"></div>
      <div class="modal-title">${s.date} — ${divName}</div>
      <div class="modal-sub">${s.work_description || t('na')}</div>
      ${s.remarks? `<div class="info-box">${s.remarks}</div>`:''}

      ${empRows}

        <a href="${s.image}" target="_blank" class="btn btn-outline btn-block btn-sm" style="margin-top:8px;text-decoration:none;">${t('downloadImg')}</a>` : ''}
      <button class="btn btn-primary btn-block" id="btnCloseModal" style="margin-top:14px;">${t('close')}</button>
    </div>`;
  document.body.appendChild(modal);
  modal.onclick = e=>{ if(e.target===modal) modal.remove(); };
  modal.querySelector('#btnCloseModal').onclick = ()=> modal.remove();
}

function openDeleteConfirm(sheetId){
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `
    <div class="modal-box" style="border-radius:18px;">
      <div class="modal-title">${t('del')}?</div>
      <div class="modal-sub">${t('confirmDelete')}</div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn btn-outline btn-block" id="btnNo">${t('cancel')}</button>
        <button class="btn btn-danger btn-block" style="background:var(--rust);color:#fff;" id="btnYes">${t('yesDelete')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

    modal.remove();
    render();
  };
}

/* =========================================================
   SUMMARY
   ========================================================= */
function currentMonthStr(){ const d=new Date(); return d.toISOString().slice(0,7); }
let summaryMonth = currentMonthStr();
function daysInMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }

function computeMonthlyData(ym){
  const dim = daysInMonth(ym);
  const data = STATE.employees.map(e=>({emp:e, sheetsCount:0, totalHours:0, days:new Array(dim+1).fill(0)}));
  STATE.sheets.forEach(s=>{
    if(!s.date.startsWith(ym)) return;
    const day = Number(s.date.split('-')[2]);
    s.employees.forEach(se=>{
      const rec = data.find(d=>d.emp.id===se.employee_id);
      if(!rec) return;
      let hrs = 0;
      se.adjustments.forEach(a=> hrs += durationHours(a.actual_start,a.actual_end));
      rec.sheetsCount += 1; rec.totalHours += hrs; rec.days[day] += hrs;
    });
  });
  return {dim, data};
}

function renderSummary(){
  const {dim, data} = computeMonthlyData(summaryMonth);
  const grandTotal = data.reduce((s,d)=>s+d.totalHours,0);
  const totalSheets = STATE.sheets.filter(s=>s.date.startsWith(summaryMonth)).length;

  return `
  <div class="section-head">
    <div><h2>${t('totalOtHours')}</h2><div class="sub">${t('summaryTitle')}</div></div>
  </div>
  <div class="card">
    <div class="row2" style="align-items:end;">
      <div class="field" style="margin-bottom:0;">
        <label>${t('month')}</label>
        <input type="month" id="monthPicker" value="${summaryMonth}">
      </div>
      ${canExport()? `<button class="btn btn-amber" id="btnExportCsv">${t('exportCsv')}</button>` :
        `<button class="btn btn-outline" disabled title="${t('permNoExport')}" style="opacity:.5;">${t('exportCsv')}</button>`}
    </div>
    ${!canExport()? `<div class="info-box" style="margin-top:10px;margin-bottom:0;">${t('permNoExport')}</div>`:''}
  </div>

  <div class="stat-row">
    <div class="stat-box"><div class="sn mono">${grandTotal.toFixed(1)}</div><div class="sl">${t('totalHours')}</div></div>
    <div class="stat-box"><div class="sn mono">${totalSheets}</div><div class="sl">${t('otSheetsCount')}</div></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="tag">Σ</span> ${t('name')} / ${t('totalHours')}</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>${t('name')}</th><th>${t('designation')}</th><th>${t('noOfSheets')}</th><th>${t('totalHours')}</th></tr></thead>
        <tbody>
        ${data.length===0? `<tr><td colspan="4">${t('noData')}</td></tr>` :
          data.map(d=>`<tr>
            <td>${d.emp.name}</td><td>${d.emp.designation}</td><td>${d.sheetsCount}</td>
            <td class="mono">${d.totalHours.toFixed(2)}</td>
          </tr>`).join('')
        }
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="tag">☷</span> ${t('calendar')}</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>${t('name')}</th>
          ${Array.from({length:dim},(_,i)=>`<th>${i+1}</th>`).join('')}
          <th>${t('total')}</th>
        </tr></thead>
        <tbody>
        ${data.length===0? `<tr><td colspan="${dim+2}">${t('noData')}</td></tr>` :
          data.map(d=>`<tr>
            <td>${d.emp.name}</td>
            ${d.days.slice(1).map(h=> h>0? `<td class="cell-h">${trimNum(h)}</td>` : `<td class="cell-x">X</td>`).join('')}
            <td class="mono" style="font-weight:700;">${d.totalHours.toFixed(1)}</td>
          </tr>`).join('')
        }
        </tbody>
      </table>
    </div>
  </div>
  `;
}
function trimNum(n){ return (Math.round(n*100)/100).toString(); }

function bindSummary(){
  const mp = document.getElementById('monthPicker');
  if(mp) mp.onchange = e=>{ summaryMonth = e.target.value; render(); };
  const exp = document.getElementById('btnExportCsv');
  if(exp) exp.onclick = ()=>{
    if(!canExport()){ toast(t('permNoExport'), true); return; }
    exportMonthlyCsv();
  };
}

function exportMonthlyCsv(){
  const {dim, data} = computeMonthlyData(summaryMonth);
  const headers = [t('name'), t('designation'), ...Array.from({length:dim},(_,i)=>String(i+1)), t('total')];
  const rows = data.map(d=>[
    d.emp.name, d.emp.designation,
    ...d.days.slice(1).map(h=> h>0 ? trimNum(h) : 'X'),
    d.totalHours.toFixed(2)
  ]);
  downloadCsv(`OT_Summary_${summaryMonth}.csv`, [headers, ...rows]);
}
function downloadCsv(filename, rows){
  const csv = rows.map(r=> r.map(cell=>{
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function bindSettings(){
  document.querySelectorAll('[data-stab]').forEach(el=>{
    el.onclick = ()=>{ settingsTab = el.getAttribute('data-stab'); render(); };
  });

  const addEmpBtn = document.getElementById('btnAddEmp');
  if(addEmpBtn) addEmpBtn.onclick = ()=> openEmpModal(null);
  document.querySelectorAll('[data-emp-edit]').forEach(el=>{ el.onclick = ()=> openEmpModal(el.getAttribute('data-emp-edit')); });
  document.querySelectorAll('[data-emp-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-emp-del');
      STATE.employees = STATE.employees.filter(e=>e.id!==id);
      try{ await DB.pushEmployees(); toast(t('empDeleted')); }catch(e){ toast(t('tokenExpired'), true); }
      render();
    };
  });

  const addDivBtn = document.getElementById('btnAddDiv');
  if(addDivBtn) addDivBtn.onclick = ()=> openDivModal();
  document.querySelectorAll('[data-div-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-div-del');
      const div = STATE.divisions.find(d=>d.id===id);
      if(div.is_default){ toast(t('cannotDeleteDefault'), true); return; }
      STATE.divisions = STATE.divisions.filter(d=>d.id!==id);
      try{ await DB.pushDivisions(); toast(t('divDeleted')); }catch(e){ toast(t('tokenExpired'), true); }
      render();
    };
  });

  document.querySelectorAll('[data-l2]').forEach(el=>{
    el.onclick = ()=>{ STATE.lang = el.getAttribute('data-l2'); LS.set('otr_lang',STATE.lang); render(); };
  });
  const savePwBtn = document.getElementById('btnSavePw');
  if(savePwBtn) savePwBtn.onclick = async ()=>{
    const pa = document.getElementById('pwAdmin').value.trim();
    const pe = document.getElementById('pwEmp').value.trim();
    let changed = false;
    if(pa){ const u=STATE.users.find(x=>x.role==='admin'); if(u){u.password=pa; changed=true;} }
    if(pe){ const u=STATE.users.find(x=>x.role==='employee'); if(u){u.password=pe; changed=true;} }
    if(changed){
      try{ await DB.pushUsers(); toast(t('pwChanged')); render(); }catch(e){ toast(t('tokenExpired'), true); }
    }
  };

  const syncNowBtn = document.getElementById('btnSyncNowS');
  if(syncNowBtn) syncNowBtn.onclick = async ()=>{
    try{ await DB.pullAll(); toast(t('savedOk')); render(); }catch(e){ toast(t('tokenExpired'), true); }
  };
  const pullNowBtn = document.getElementById('btnPullNowS');
  if(pullNowBtn) pullNowBtn.onclick = async ()=>{
    try{ await DB.pullAll(); toast(t('savedOk')); render(); }catch(e){ toast(t('tokenExpired'), true); }
  };
  const changeSSBtn = document.getElementById('btnChangeSS');
  if(changeSSBtn) changeSSBtn.onclick = ()=> DB.changeSpreadsheet();
  const reconnectBtn = document.getElementById('btnReconnectS');
  if(reconnectBtn) reconnectBtn.onclick = ()=>{
    DB.setStatus('connecting');
    DB.ensureTokenClient(async ()=>{
      DB.connected = true; DB.setStatus('on');
      try{ await DB.pullAll(); toast(t('cloudConnected')||t('savedOk')); render(); }catch(e){ DB.setStatus('error'); }
    });
  };
}

function openEmpModal(empId){
  if(!empId && !canAddEmployee()){ toast(t('permNoAddEmp'), true); return; }
  const emp = empId ? STATE.employees.find(e=>e.id===empId) : {name:'', designation:'', active:true};
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${empId? t('edit') : t('addEmployee')}</div>
      <div class="field"><label>${t('empName')}</label><input type="text" id="mEmpName" value="${emp.name}"></div>
      <div class="field"><label>${t('empDesig')}</label><input type="text" id="mEmpDesig" value="${emp.designation}"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-block" id="mCancel">${t('cancel')}</button>
        <button class="btn btn-primary btn-block" id="mSave">${t('saveBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mCancel').onclick = ()=> modal.remove();
  modal.querySelector('#mSave').onclick = async ()=>{
    const name = document.getElementById('mEmpName').value.trim();
    const desig = document.getElementById('mEmpDesig').value.trim();
    if(!name){ toast(t('fillRequired'), true); return; }
    if(empId){
      const rec = STATE.employees.find(e=>e.id===empId);
      rec.name = name; rec.designation = desig;
    } else {
      STATE.employees.push({id:uid('emp'), name, designation:desig, active:true});
    }
    try{ await DB.pushEmployees(); toast(t('savedOk')); }catch(e){ toast(t('tokenExpired'), true); }
    modal.remove();
    render();
  };
}

function openDivModal(){
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${t('addDivision')}</div>
      <div class="field"><label>${t('nameBn')}</label><input type="text" id="mDivBn"></div>
      <div class="field"><label>${t('nameEn')}</label><input type="text" id="mDivEn"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-block" id="mCancel">${t('cancel')}</button>
        <button class="btn btn-primary btn-block" id="mSave">${t('saveBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mCancel').onclick = ()=> modal.remove();
  modal.querySelector('#mSave').onclick = async ()=>{
    const bn = document.getElementById('mDivBn').value.trim();
    const en = document.getElementById('mDivEn').value.trim();
    if(!bn && !en){ toast(t('fillRequired'), true); return; }
    STATE.divisions.push({id:uid('div'), name_bn:bn||en, name_en:en||bn, is_default:false, active:true});
    try{ await DB.pushDivisions(); toast(t('savedOk')); }catch(e){ toast(t('tokenExpired'), true); }
    modal.remove();
    render();
  };
}

(function boot(){
  STATE.screen = 'boot';
  render();
  if(!DB.clientId || !DB.apiKey){
    STATE.screen = 'setup';
    render();
    return;
  }
  // have credentials saved: show the connect button (token requests need a user gesture)
  STATE.screen = 'connect';
  render();
})();
