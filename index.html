<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F2E2C">
<title>OT_Record — অতিরিক্ত কর্মঘন্টা ব্যবস্থাপনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2E2C;
  --ink-2:#163F3B;
  --paper:#F6F4EE;
  --paper-2:#EDEAE1;
  --line:#D9D4C6;
  --amber:#C77C2C;
  --amber-2:#E0954A;
  --rust:#B0483B;
  --moss:#4B7A5A;
  --white:#FFFFFF;
  --ink-soft:#5B6A66;
  --shadow: 0 1px 2px rgba(15,46,44,.06), 0 4px 14px rgba(15,46,44,.07);
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(199,124,44,.08), transparent 60%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}
#root{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:82px;}

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--amber),var(--rust));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;
}
.brand-title{font-size:15px;font-weight:600;line-height:1.15;}
.brand-sub{font-size:10.5px;color:#9FC2B8;letter-spacing:.04em;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}
.icon-btn:active{background:rgba(255,255,255,.18);}

main{padding:16px 16px 24px;}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card-title .tag{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--amber);
  background:rgba(199,124,44,.1);border:1px solid rgba(199,124,44,.25);
  padding:2px 6px;border-radius:5px;letter-spacing:.05em;
}

label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.01em;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#fff;}
textarea{resize:vertical;min-height:64px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;
  cursor:pointer;font-family:inherit;transition:transform .06s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:var(--rust);border:1.5px solid rgba(176,72,59,.3);}
.btn-ghost{background:rgba(15,46,44,.05);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;
  background:var(--ink);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.15);
}
.navitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;color:#7FA79C;cursor:pointer;
  font-size:10px;font-weight:600;letter-spacing:.01em;
}
.navitem .ni-ico{font-size:18px;line-height:1;}
.navitem.active{color:var(--amber-2);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-amber{background:rgba(199,124,44,.12);color:var(--amber);}
.badge-moss{background:rgba(75,122,90,.12);color:var(--moss);}
.badge-rust{background:rgba(176,72,59,.12);color:var(--rust);}
.badge-gray{background:var(--paper-2);color:var(--ink-soft);}

.sheet-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.sheet-card .date-block{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);font-weight:600;
}
.sheet-card h4{margin:2px 0 6px;font-size:14.5px;font-weight:600;}
.sheet-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.sheet-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.sheet-actions{display:flex;gap:8px;margin-top:10px;}
.sheet-emp-list{margin:8px 0;border-top:1px dashed var(--line);padding-top:6px;}
.sheet-emp-line{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0;color:var(--ink-soft);}
.sheet-emp-line b{color:var(--ink);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-emp-line .t{font-family:'JetBrains Mono',monospace;color:var(--ink);white-space:nowrap;font-size:11px;}
.hrs-live{font-size:11.5px;color:var(--moss);font-weight:700;margin:-2px 0 8px;text-align:right;}
.hrs-live-total{font-size:12px;font-weight:700;color:var(--ink);text-align:right;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line);}

.emp-row{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--paper-2);
}
.emp-row:last-child{border-bottom:none;}
.emp-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;
}
.emp-check.checked{background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:13px;}
.emp-name{font-size:14px;font-weight:600;flex:1;}
.emp-desig{font-size:11px;color:var(--ink-soft);}

.slot-adjust{
  margin-top:8px;padding:10px;background:var(--paper);border-radius:10px;border:1px dashed var(--line);
}
.slot-adjust-title{font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}

.slot-item{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;
  background:var(--paper);border-radius:10px;
}
.slot-item span{font-size:12px;color:var(--ink-soft);}

.selectall-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 10px;background:var(--paper);border-radius:10px;margin-bottom:8px;
  border:1px dashed var(--line);
}
.selectall-bar span{font-size:12.5px;font-weight:600;color:var(--ink-soft);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(15,46,44,.15);border:1px solid var(--line);}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--rust));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:22px;margin:0 auto 16px;}
.role-toggle{display:flex;background:var(--paper-2);border-radius:10px;padding:3px;margin-bottom:18px;}
.role-toggle button{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.role-toggle button.active{background:var(--ink);color:var(--paper);}
.spin{width:34px;height:34px;border:3px solid var(--paper-2);border-top-color:var(--amber);border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--paper-2);}
th{background:var(--paper-2);font-weight:600;color:var(--ink-soft);font-size:10.5px;position:sticky;top:0;}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:right;font-weight:600;z-index:1;}
th:first-child{background:var(--paper-2);z-index:2;}
tr:nth-child(even) td{background:#FBFAF7;}
tr:nth-child(even) td:first-child{background:#FBFAF7;}
.cell-x{color:#C7C2B4;}
.cell-h{color:var(--moss);font-weight:600;}

.empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
.empty .ei{font-size:38px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13.5px;margin:4px 0;}

#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:30px;
  font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:88%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--rust);}

.modal-bg{position:fixed;inset:0;background:rgba(15,46,44,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.center{align-items:center;padding:20px;}
.modal-box{
  background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  animation:slideup .22s ease;
}
.modal-bg.center .modal-box{border-radius:18px;max-width:400px;animation:popin .18s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes popin{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}

.lang-toggle{display:flex;gap:6px;}
.lang-toggle button{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:18px;font-weight:700;margin:0;font-family:'Space Grotesk',sans-serif;}
.section-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.divider{height:1px;background:var(--line);margin:14px 0;}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat-box .sn{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--ink);}
.stat-box .sl{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.img-thumb{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line);display:block;}
.upload-box{
  border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;background:var(--paper);font-size:12.5px;color:var(--ink-soft);
}

.search-box{position:relative;margin-bottom:14px;}
.search-box input{padding-left:36px;}
.search-box::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}

.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.pill{flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

::-webkit-scrollbar{height:5px;width:5px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}

.warn-box{background:rgba(176,72,59,.08);border:1px solid rgba(176,72,59,.25);color:var(--rust);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;font-weight:500;}
.info-box{background:rgba(75,122,90,.08);border:1px solid rgba(75,122,90,.25);color:var(--moss);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}

.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.sync-dot.on{background:var(--moss);box-shadow:0 0 0 3px rgba(75,122,90,.15);}
.sync-dot.off{background:#C7C2B4;}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.steps-box{font-size:12px;color:var(--ink-soft);line-height:1.85;background:var(--paper);border-radius:10px;padding:12px 14px;}
.steps-box b{color:var(--ink);}
.steps-box a{color:var(--amber);text-decoration:none;font-weight:600;}
.topbar-sync{display:flex;align-items:center;font-size:10px;color:#9FC2B8;}
</style>
</head>

/* =========================================================
   API CLIENT — the ONLY thing this app talks to.
   Every call is a POST with a JSON string body. Content-Type
   is intentionally left as the browser's default (text/plain)
   so the request stays a CORS "simple request" and the Apps
   Script backend's automatic Access-Control-Allow-Origin: *
   applies without a failed preflight.
   ========================================================= */
const API = {
  baseUrl: localStorage.getItem('otr_api_url') || '',
  token: localStorage.getItem('otr_token') || '',
  status: 'off', // off | busy | on | error

  setStatus(s){ this.status = s; const el=document.getElementById('syncStatusDot'); if(el){ el.className='sync-dot '+(s==='on'?'on':(s==='busy'?'busy':'off')); } },

  async call(action, payload={}){
    this.setStatus('busy');
    if(!this.baseUrl){
      this.setStatus('error');
      const e = new Error('no_url'); throw e;
    }
    let res;
    try{
      const body = JSON.stringify(Object.assign({action, token:this.token}, payload));
      res = await fetch(this.baseUrl, { method:'POST', body });
    }catch(networkErr){
      this.setStatus('error');
      const e = new Error('network_fail'); throw e;
    }
    if(!res.ok){
      this.setStatus('error');
      const e = new Error('http_'+res.status); throw e;
    }
    let text;
    try{ text = await res.text(); }
    catch(readErr){ this.setStatus('error'); throw new Error('network_fail'); }
    let data;
    try{ data = JSON.parse(text); }
    catch(parseErr){
      this.setStatus('error');
      // Apps Script returns HTML (a Google login/consent page) instead of JSON
      // when the deployment's access isn't set to "Anyone", or the URL is wrong/undeployed.
      const e = new Error('bad_response'); throw e;
    }
    this.setStatus('on');
    return data;
  },

  async login(username, password){
    const res = await this.call('login', {username, password});
    if(res.ok){
      this.token = res.token;
      localStorage.setItem('otr_token', res.token);
    }
    return res;
  },
  async logout(){
    try{ await this.call('logout'); }catch(e){}
    this.token = '';
    localStorage.removeItem('otr_token');
  },
  setBaseUrl(url){
    this.baseUrl = url.trim();
    localStorage.setItem('otr_api_url', this.baseUrl);
  },
  changeServer(){
    localStorage.removeItem('otr_api_url');
    localStorage.removeItem('otr_token');
    this.baseUrl = ''; this.token = '';
    STATE.session = null;
    STATE.screen = 'setup';
    render();
  }
};

function diagnoseErr(e){
  const code = e && e.message;
  if(code==='no_url') return t('errNoUrl');
  if(code==='network_fail') return t('errNetwork');
  if(code==='bad_response') return t('errBadResponse');
  if(code && code.indexOf('http_')===0) return t('errHttp') + ' (' + code.replace('http_','') + ')';
  return t('networkErr');
}

/* ---------- time utils ---------- */
function toMin(hhmm){
  if(!hhmm) return null;
  const [h,m] = String(hhmm).split(':').map(Number);
  return h*60+m;
}
function durationHours(start, end){
  let s = toMin(start), e = toMin(end);
  if(s===null||e===null) return 0;
  if(e <= s) e += 24*60;
  return +( (e-s)/60 ).toFixed(2);
}
function fmtHM(hhmm){ return hhmm || '—'; }

/* ---------- Bengali numeral helper ---------- */
const BN_DIGITS = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function bnum(input){
  if(input===null||input===undefined) return '';
  let s = String(input);
  if(STATE.lang!=='bn') return s;
  return s.replace(/[0-9]/g, d=> BN_DIGITS[+d]);
}

function intervalsOverlap(aS,aE,bS,bE){
  let as=toMin(aS), ae=toMin(aE), bs=toMin(bS), be=toMin(bE);
  if(ae<=as) ae+=24*60;
  if(be<=bs) be+=24*60;
  return as < be && bs < ae;
}
function findConflicts(employeeId, date, newIntervals, excludeSheetId){
  const conflicts = [];
  STATE.sheets.forEach(sh=>{
    if(sh.id === excludeSheetId) return;
    if(sh.date !== date) return;
    const empEntry = sh.employees.find(e=>e.employee_id===employeeId);
    if(!empEntry) return;
    empEntry.adjustments.forEach(adj=>{
      newIntervals.forEach(ni=>{
        if(intervalsOverlap(ni.start, ni.end, adj.actual_start, adj.actual_end)){
          conflicts.push({sheet:sh, existing:adj});
        }
      });
    });
  });
  return conflicts;
}

/* ---------- render root ---------- */
function render(){
  const root = document.getElementById('root');
  document.documentElement.lang = STATE.lang;

  if(STATE.screen==='boot'){ root.innerHTML = renderBootScreen(); return; }
  if(STATE.screen==='setup'){ root.innerHTML = renderSetupScreen(); bindSetupScreen(); return; }

  if(!STATE.session){
    root.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  let body = '';
  if(STATE.screen==='new') body = renderNewSheet();
  else if(STATE.screen==='records') body = renderRecords();
  else if(STATE.screen==='summary') body = renderSummary();
  else if(STATE.screen==='settings') body = renderSettings();
  else body = renderNewSheet();

  root.innerHTML = `
    ${renderTopbar()}
    <main>${body}</main>
    ${renderBottomNav()}
  `;
  bindGlobal();
}

function bindLogin(){
  document.querySelectorAll('[data-role]').forEach(b=>{
    b.onclick = ()=>{ loginRole = b.getAttribute('data-role'); render(); };
  });
  document.querySelectorAll('[data-l]').forEach(b=>{
    b.onclick = ()=>{ STATE.lang = b.getAttribute('data-l'); LS.set('otr_lang',STATE.lang); render(); };
  });
  document.getElementById('btnSignIn').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnSignIn');
  btn.disabled = true;
  document.getElementById('loginErrBox').innerHTML = '';
  try{
    const res = await API.login(u, p);
    if(!res.ok || res.role !== loginRole){
      const msg = res.error==='locked_out' ? t('lockedOut') : t('loginErr');
      document.getElementById('loginErrBox').innerHTML = `<div class="warn-box">${msg}</div>`;
      btn.disabled = false;
      return;
    }
    STATE.session = {username: res.username, role: res.role};
    await loadBootstrap();
    STATE.screen = 'new';
    render();
  }catch(e){
    document.getElementById('loginErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
    btn.disabled = false;
  }
}

async function loadBootstrap(){
  const res = await API.call('getBootstrap');
  if(res.ok){
    STATE.employees = res.employees || [];
    STATE.divisions = res.divisions || [];
    STATE.sheets = res.sheets || [];
    STATE.loaded = true;
  }
  return res;
}

      </div>
    </div>
    ${checked? `

      ${sheetDraft.slots.map((s,i)=>{
        const adj = inSheet.adjustments.find(a=>a.slot_id===s.id) || {actual_start:s.start, actual_end:s.end};
        const hrs = durationHours(adj.actual_start, adj.actual_end);
        return `
        <div class="row2" style="margin-bottom:6px;">
          <div>
            <label style="margin-bottom:3px;">${t('start')} (${bnum(i+1)})</label>

          </div>
          <div>
            <label style="margin-bottom:3px;">${t('end')} (${bnum(i+1)})</label>

      }).join('')}
      <div class="hrs-live-total" id="hrstotal-${e.id}">${t('total')}: ${bnum(trimNum(inSheet.adjustments.reduce((sum,a)=>sum+durationHours(a.actual_start,a.actual_end),0)))} ${t('hours')}</div>
    </div>` : ''}
  </div>`;

function updateSlotHrsLive(sid){
  const slot = sheetDraft.slots.find(s=>s.id===sid);
  if(!slot) return;
  const hrs = durationHours(slot.start, slot.end);
  const el = document.getElementById(`slothrs-${sid}`);
  if(el) el.textContent = `${t('timeHrs')}: ${bnum(trimNum(hrs))}`;
}

function updateHrsLive(eid, sid){
  const empEntry = sheetDraft.employees.find(x=>x.employee_id===eid);
  if(!empEntry) return;
  const adj = empEntry.adjustments.find(a=>a.slot_id===sid);
  const hrs = durationHours(adj.actual_start, adj.actual_end);
  const elS = document.getElementById(`hrs-${eid}-${sid}`);
  if(elS) elS.textContent = `= ${bnum(trimNum(hrs))} ${t('hours')}`;
  const total = empEntry.adjustments.reduce((sum,a)=>sum+durationHours(a.actual_start,a.actual_end),0);
  const elT = document.getElementById(`hrstotal-${eid}`);
  if(elT) elT.textContent = `${t('total')}: ${bnum(trimNum(total))} ${t('hours')}`;
}

function bindScreenSpecific(){
  if(STATE.screen==='new') bindNewSheet();
  else if(STATE.screen==='records') bindRecords();
  else if(STATE.screen==='summary') bindSummary();
  else if(STATE.screen==='settings') bindSettings();
}

function bindNewSheet(){
  const byId = id=>document.getElementById(id);
  if(byId('fDate')) byId('fDate').onchange = e=>{ sheetDraft.date = e.target.value; };
  if(byId('fDivision')) byId('fDivision').onchange = e=>{ sheetDraft.division_id = e.target.value; };
  if(byId('fWorkDesc')) byId('fWorkDesc').oninput = e=>{ sheetDraft.work_description = e.target.value; };
  if(byId('fRemarks')) byId('fRemarks').oninput = e=>{ sheetDraft.remarks = e.target.value; };

  document.querySelectorAll('[data-slot-start]').forEach(el=>{
    el.onchange = e=>{
      const sid = el.getAttribute('data-slot-start');
      sheetDraft.slots.find(s=>s.id===sid).start = e.target.value;
      updateSlotHrsLive(sid);
    };
  });
  document.querySelectorAll('[data-slot-end]').forEach(el=>{
    el.onchange = e=>{
      const sid = el.getAttribute('data-slot-end');
      sheetDraft.slots.find(s=>s.id===sid).end = e.target.value;
      updateSlotHrsLive(sid);
    };
  });
  document.querySelectorAll('[data-slot-del]').forEach(el=>{
    el.onclick = ()=>{
      const sid = el.getAttribute('data-slot-del');
      sheetDraft.slots = sheetDraft.slots.filter(s=>s.id!==sid);
      sheetDraft.employees.forEach(e=>{ e.adjustments = e.adjustments.filter(a=>a.slot_id!==sid); });
      render();
    };
  });
  const addSlotBtn = byId('btnAddSlot');
  if(addSlotBtn) addSlotBtn.onclick = ()=>{
    const newSlot = {id:uid('slot'), start:'16:00', end:'18:00'};
    sheetDraft.slots.push(newSlot);
    sheetDraft.employees.forEach(e=>{ e.adjustments.push({slot_id:newSlot.id, actual_start:newSlot.start, actual_end:newSlot.end}); });
    render();
  };

  const selectAllBtn = byId('btnSelectAll');
  if(selectAllBtn) selectAllBtn.onclick = ()=>{
    const emps = STATE.employees.filter(e=>e.active);
    const allSelected = emps.every(e=> sheetDraft.employees.find(x=>x.employee_id===e.id));
    if(allSelected){
      sheetDraft.employees = [];
    } else {
      emps.forEach(e=>{
        if(!sheetDraft.employees.find(x=>x.employee_id===e.id)){
          sheetDraft.employees.push({
            employee_id: e.id,
            adjustments: sheetDraft.slots.map(s=>({slot_id:s.id, actual_start:s.start, actual_end:s.end}))
          });
        }
      });
    }
    render();
  };

  document.querySelectorAll('[data-emp-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const eid = el.getAttribute('data-emp-toggle');
      const idx = sheetDraft.employees.findIndex(x=>x.employee_id===eid);
      if(idx>=0){ sheetDraft.employees.splice(idx,1); }
      else {
        sheetDraft.employees.push({
          employee_id: eid,
          adjustments: sheetDraft.slots.map(s=>({slot_id:s.id, actual_start:s.start, actual_end:s.end}))
        });
      }
      render();
    };
  });
  document.querySelectorAll('[data-adj-start]').forEach(el=>{
    el.onchange = e=>{
      const [eid,sid] = el.getAttribute('data-adj-start').split('|');
      sheetDraft.employees.find(x=>x.employee_id===eid).adjustments.find(a=>a.slot_id===sid).actual_start = e.target.value;
      updateHrsLive(eid, sid);
    };
  });
  document.querySelectorAll('[data-adj-end]').forEach(el=>{
    el.onchange = e=>{
      const [eid,sid] = el.getAttribute('data-adj-end').split('|');
      sheetDraft.employees.find(x=>x.employee_id===eid).adjustments.find(a=>a.slot_id===sid).actual_end = e.target.value;
      updateHrsLive(eid, sid);
    };
  });

  const uploadBox = byId('uploadBox');
  const fileInput = byId('fileImg');
  if(uploadBox) uploadBox.onclick = ()=> fileInput.click();
  if(fileInput) fileInput.onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev=>{
      byId('uploadStatus').innerHTML = `<div class="info-box">${t('uploading')}</div>`;
      try{
        const res = await API.call('uploadImage', {
          base64: ev.target.result,
          filename: `OT_${sheetDraft.date}_${Date.now()}.jpg`,
          mimeType: file.type || 'image/jpeg'
        });
        if(res.ok){ sheetDraft.image = res.url; render(); }
        else { toast(t('networkErr'), true); byId('uploadStatus').innerHTML=''; }
      }catch(err){
        toast(t('networkErr'), true);
        byId('uploadStatus').innerHTML='';
      }
    };
    reader.readAsDataURL(file);
  };

  const saveBtn = byId('btnSaveSheet');
  if(saveBtn) saveBtn.onclick = doSaveSheet;
  const cancelBtn = byId('btnCancelEdit');
  if(cancelBtn) cancelBtn.onclick = ()=>{ STATE.editingSheetId = null; sheetDraft = null; STATE.screen = 'records'; render(); };
}

async function doSaveSheet(){
  document.getElementById('formErrBox').innerHTML = '';
  if(!sheetDraft.date || !sheetDraft.division_id){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('fillRequired')}</div>`;
    return;
  }
  if(sheetDraft.employees.length===0){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('selectAtLeastOne')}</div>`;
    return;
  }
  const excludeId = sheetDraft.id;
  for(const emp of sheetDraft.employees){
    const intervals = emp.adjustments.map(a=>({start:a.actual_start, end:a.actual_end}));
    const conflicts = findConflicts(emp.employee_id, sheetDraft.date, intervals, excludeId);
    if(conflicts.length>0){
      const empObj = STATE.employees.find(x=>x.id===emp.employee_id);
      document.getElementById('formErrBox').innerHTML = `<div class="warn-box">⚠ ${esc(empObj? empObj.name:'')} — ${t('overlapErr')}</div>`;
      return;
    }
  }

  const saveBtn = document.getElementById('btnSaveSheet');
  if(saveBtn) saveBtn.disabled = true;

  try{
    const res = await API.call('saveSheet', {sheet: sheetDraft});
    if(!res.ok){
      if(res.error==='overlap'){
        const empObj = STATE.employees.find(x=>x.id===res.employee_id);
        document.getElementById('formErrBox').innerHTML = `<div class="warn-box">⚠ ${esc(empObj?empObj.name:'')} — ${t('overlapErr')}</div>`;
      } else if(res.error==='unauthorized'){
        toast(t('sessionExpired'), true);
        STATE.session = null; render();
      } else {
        document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('networkErr')}</div>`;
      }
      if(saveBtn) saveBtn.disabled = false;
      return;
    }
    const idx = STATE.sheets.findIndex(s=>s.id===res.sheet.id);
    if(idx>=0) STATE.sheets[idx] = res.sheet; else STATE.sheets.push(res.sheet);
    toast(sheetDraft.id ? t('updatedOk') : t('savedOk'));
    STATE.editingSheetId = null;
    sheetDraft = null;
    STATE.screen = 'records';
    render();
  }catch(e){
    document.getElementById('formErrBox').innerHTML = `<div class="warn-box">${t('networkErr')}</div>`;
    if(saveBtn) saveBtn.disabled = false;
  }
}

  const empLines = s.employees.map(e=>{
    const emp = STATE.employees.find(x=>x.id===e.employee_id) || {name:'?'};
    let hrs = 0;
    const times = e.adjustments.map(a=>{
      hrs += durationHours(a.actual_start,a.actual_end);
      return `${bnum(fmtHM(a.actual_start))}–${bnum(fmtHM(a.actual_end))}`;
    }).join(', ');

  }).join('');
  return `
  <div class="sheet-card">
    <div class="date-block">${bnum(s.date)}</div>
    <h4>${esc(divName)}</h4>
    <p>${esc((s.work_description||'').slice(0,120)) || t('na')}</p>

    <div class="sheet-meta">
      <span class="badge badge-amber">${bnum(empCount)} ${t('employees')}</span>

   SUMMARY
   ========================================================= */
function currentMonthStr(){ const d=new Date(); return d.toISOString().slice(0,7); }
let summaryMonth = currentMonthStr();
function daysInMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }

function computeMonthlyData(ym){
  const dim = daysInMonth(ym);
  const data = STATE.employees.map(e=>({emp:e, sheetsCount:0, totalHours:0, days:new Array(dim+1).fill(0)}));
  STATE.sheets.forEach(s=>{
    if(!s.date.startsWith(ym)) return;
    const day = Number(s.date.split('-')[2]);
    s.employees.forEach(se=>{
      const rec = data.find(d=>d.emp.id===se.employee_id);
      if(!rec) return;
      let hrs = 0;
      se.adjustments.forEach(a=> hrs += durationHours(a.actual_start,a.actual_end));
      rec.sheetsCount += 1; rec.totalHours += hrs; rec.days[day] += hrs;
    });
  });
  return {dim, data};
}

function renderSummary(){
  const {dim, data} = computeMonthlyData(summaryMonth);
  const grandTotal = data.reduce((s,d)=>s+d.totalHours,0);
  const totalSheets = STATE.sheets.filter(s=>s.date.startsWith(summaryMonth)).length;

  return `
  <div class="section-head">
    <div><h2>${t('totalOtHours')}</h2><div class="sub">${t('summaryTitle')}</div></div>
  </div>
  <div class="card">
    <div class="field" style="margin-bottom:0;">
      <label>${t('month')}</label>
      <input type="month" id="monthPicker" value="${summaryMonth}">
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-box"><div class="sn mono">${bnum(grandTotal.toFixed(1))}</div><div class="sl">${t('totalHours')}</div></div>
    <div class="stat-box"><div class="sn mono">${bnum(totalSheets)}</div><div class="sl">${t('otSheetsCount')}</div></div>
  </div>

  <div class="card">
    <div class="card-title"><span class="tag">Σ</span> ${t('name')} / ${t('totalHours')}</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>${t('name')}</th><th>${t('designation')}</th><th>${t('noOfSheets')}</th><th>${t('totalHours')}</th></tr></thead>
        <tbody>
        ${data.length===0? `<tr><td colspan="4">${t('noData')}</td></tr>` :
          data.map(d=>`<tr>
            <td>${esc(d.emp.name)}</td><td>${esc(d.emp.designation)}</td><td>${bnum(d.sheetsCount)}</td>
            <td class="mono">${bnum(d.totalHours.toFixed(2))}</td>
          </tr>`).join('')
        }
        </tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span class="tag">☷</span> ${t('calendar')}</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>${t('name')}</th>
          ${Array.from({length:dim},(_,i)=>`<th>${bnum(i+1)}</th>`).join('')}
          <th>${t('total')}</th>
        </tr></thead>
        <tbody>
        ${data.length===0? `<tr><td colspan="${dim+2}">${t('noData')}</td></tr>` :
          data.map(d=>`<tr>
            <td>${esc(d.emp.name)}</td>
            ${d.days.slice(1).map(h=> h>0? `<td class="cell-h">${bnum(trimNum(h))}</td>` : `<td class="cell-x">X</td>`).join('')}
            <td class="mono" style="font-weight:700;">${bnum(d.totalHours.toFixed(1))}</td>
          </tr>`).join('')
        }
        </tbody>
      </table>
    </div>
  </div>
  `;
}
function trimNum(n){ return (Math.round(n*100)/100).toString(); }

function bindSummary(){
  const mp = document.getElementById('monthPicker');
  if(mp) mp.onchange = e=>{ summaryMonth = e.target.value; render(); };
}

/* =========================================================
   SETTINGS
   Employees + Divisions available to both roles (add-employee
   is admin-only). Account and Organization tabs are admin-only.
   There is no "Google Sync" tab at all — the frontend has no
   Google integration to configure.
   ========================================================= */
let settingsTab = 'employees';
function renderSettings(){
  const tabs = [
    {id:'employees', label:t('empMgmt')},
    {id:'divisions', label:t('divMgmt')}
  ];
  if(isAdmin()) tabs.push({id:'account', label:t('account')});
  if(!isAdmin() && settingsTab==='account') settingsTab = 'employees';

  return `
  <div class="section-head"><div><h2>${t('settingsTitle')}</h2></div></div>

  <div class="pill-scroll">
    ${tabs.map(tb=>`<div class="pill ${settingsTab===tb.id?'active':''}" data-stab="${tb.id}">${tb.label}</div>`).join('')}
  </div>

  ${settingsTab==='employees'? renderEmpSettings() : ''}
  ${settingsTab==='divisions'? renderDivSettings() : ''}
  ${settingsTab==='account' && isAdmin()? renderAccountSettings() : ''}
  `;
}

function renderEmpSettings(){
  const emps = STATE.employees;
  return `
  <div class="card">
    <div class="card-title">${t('empMgmt')}</div>
    ${emps.map(e=>`
      <div class="emp-row">
        <div style="flex:1;">
          <div class="emp-name">${esc(e.name)} ${!e.active?`<span class="badge badge-gray">${t('inactive')}</span>`:''}</div>
          <div class="emp-desig">${esc(e.designation)}</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-ghost btn-sm" data-emp-edit="${e.id}">${t('edit')}</button>
          <button class="btn btn-danger btn-sm" data-emp-del="${e.id}">${t('del')}</button>
        </div>
      </div>
    `).join('')}
    ${canAddEmployee()? `<button class="btn btn-amber btn-block" id="btnAddEmp" style="margin-top:10px;">${t('addEmployee')}</button>` :
      `<div class="info-box" style="margin-top:10px;">${t('permNoAddEmp')}</div>`}
    ${canAddEmployee()? `<button class="btn btn-outline btn-block" id="btnRestoreDefaults" style="margin-top:8px;">${t('restoreDefaults')}</button>`:''}
  </div>`;
}

function renderDivSettings(){
  const divs = STATE.divisions;
  return `
  <div class="card">
    <div class="card-title">${t('divMgmt')}</div>
    ${divs.map(d=>`
      <div class="emp-row">
        <div style="flex:1;">
          <div class="emp-name">${esc(STATE.lang==='bn'?d.name_bn:d.name_en)} ${d.is_default?`<span class="badge badge-gray">default</span>`:''}</div>
          <div class="emp-desig">${esc(STATE.lang==='bn'?d.name_en:d.name_bn)}</div>
        </div>
        ${!d.is_default? `<button class="btn btn-danger btn-sm" data-div-del="${d.id}">${t('del')}</button>` : ''}
      </div>
    `).join('')}
    <button class="btn btn-amber btn-block" id="btnAddDiv" style="margin-top:10px;">${t('addDivision')}</button>
  </div>`;
}

function renderAccountSettings(){
  return `
  <div class="card">
    <div class="card-title">${t('account')}</div>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">${t('loggedInAs')}: <b>${esc(STATE.session.username)}</b> (${STATE.session.role==='admin'?t('roleAdmin'):t('roleEmployee')})</p>
    <div class="field">
      <label>${t('changePw')} — Admin</label>
      <input type="password" id="pwAdmin" placeholder="${t('newPw')}">
    </div>
    <div class="field">
      <label>${t('changePw')} — ${t('roleEmployee')}</label>
      <input type="password" id="pwEmp" placeholder="${t('newPw')}">
    </div>
    <button class="btn btn-primary btn-block" id="btnSavePw">${t('saveBtn')}</button>
  </div>
  <div class="card">
    <div class="card-title">${t('langSet')}</div>
    <div class="lang-toggle">
      <button data-l2="bn" class="${STATE.lang==='bn'?'active':''}">বাংলা</button>
      <button data-l2="en" class="${STATE.lang==='en'?'active':''}">English</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Server</div>
    <button class="btn btn-outline btn-block" id="btnChangeServer">${t('editApiUrl')}</button>
  </div>`;
}

function bindSettings(){
  document.querySelectorAll('[data-stab]').forEach(el=>{
    el.onclick = ()=>{ settingsTab = el.getAttribute('data-stab'); render(); };
  });

  const addEmpBtn = document.getElementById('btnAddEmp');
  if(addEmpBtn) addEmpBtn.onclick = ()=> openEmpModal(null);
  const restoreBtn = document.getElementById('btnRestoreDefaults');
  if(restoreBtn) restoreBtn.onclick = restoreDefaultEmployees;
  document.querySelectorAll('[data-emp-edit]').forEach(el=>{ el.onclick = ()=> openEmpModal(el.getAttribute('data-emp-edit')); });
  document.querySelectorAll('[data-emp-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-emp-del');
      try{
        const res = await API.call('deleteEmployee', {id});
        if(res.ok){ STATE.employees = STATE.employees.filter(e=>e.id!==id); toast(t('empDeleted')); }
        else toast(t('networkErr'), true);
      }catch(e){ toast(t('networkErr'), true); }
      render();
    };
  });

  const addDivBtn = document.getElementById('btnAddDiv');
  if(addDivBtn) addDivBtn.onclick = ()=> openDivModal();
  document.querySelectorAll('[data-div-del]').forEach(el=>{
    el.onclick = async ()=>{
      const id = el.getAttribute('data-div-del');
      try{
        const res = await API.call('deleteDivision', {id});
        if(res.ok){ STATE.divisions = STATE.divisions.filter(d=>d.id!==id); toast(t('divDeleted')); }
        else if(res.error==='default'){ toast(t('cannotDeleteDefault'), true); }
        else toast(t('networkErr'), true);
      }catch(e){ toast(t('networkErr'), true); }
      render();
    };
  });

  document.querySelectorAll('[data-l2]').forEach(el=>{
    el.onclick = ()=>{ STATE.lang = el.getAttribute('data-l2'); LS.set('otr_lang',STATE.lang); render(); };
  });
  const savePwBtn = document.getElementById('btnSavePw');
  if(savePwBtn) savePwBtn.onclick = async ()=>{
    const pa = document.getElementById('pwAdmin').value.trim();
    const pe = document.getElementById('pwEmp').value.trim();
    try{
      if(pa) await API.call('changePassword', {role:'admin', newPassword:pa});
      if(pe) await API.call('changePassword', {role:'employee', newPassword:pe});
      if(pa||pe) toast(t('pwChanged'));
    }catch(e){ toast(t('networkErr'), true); }
  };
  const changeServerBtn = document.getElementById('btnChangeServer');
  if(changeServerBtn) changeServerBtn.onclick = ()=> API.changeServer();
}

async function restoreDefaultEmployees(){
  const defaults = [
    ['emp1','জনাব মোঃ রেজাউল করিম','সিনিঃ ফোরম্যান'],
    ['emp2','জনাব মোঃ ওমর ফারুক','সিনিঃ ফোরম্যান'],
    ['emp3','জনাব মোঃ আলাল উদ্দিন','সিনিঃ টেকনিশিয়ান'],
    ['emp4','জনাব মাসুদ রানা খান','জুনিঃ টেকনিশিয়ান'],
    ['emp5','জনাব মমিন খন্দকার','জুনিঃ টেকনিশিয়ান'],
    ['emp6','সুমন হোসেন','জুনিঃ টেকনিশিয়ান']
  ];
  const missing = defaults.filter(row => !STATE.employees.find(e=>e.name===row[1]));
  if(missing.length===0){ toast(t('noneMissing')); return; }
  try{
    for(const row of missing.slice().reverse()){
      const res = await API.call('saveEmployee', {employee:{name:row[1], designation:row[2], active:true, employee_code:'', basic_salary:''}});
      if(res.ok) STATE.employees.unshift(res.employee);
    }
    toast(t('savedOk'));
  }catch(e){ toast(t('networkErr'), true); }
  render();
}

function openEmpModal(empId){
  if(!empId && !canAddEmployee()){ toast(t('permNoAddEmp'), true); return; }
  const emp = empId ? STATE.employees.find(e=>e.id===empId) : {name:'', designation:'', active:true, employee_code:'', basic_salary:''};
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${empId? t('edit') : t('addEmployee')}</div>
      <div class="field"><label>${t('empName')}</label><input type="text" id="mEmpName" value="${esc(emp.name)}"></div>
      <div class="field"><label>${t('empDesig')}</label><input type="text" id="mEmpDesig" value="${esc(emp.designation)}"></div>
      <div class="row2">
        <div class="field"><label>${t('empCode')}</label><input type="text" id="mEmpCode" value="${esc(emp.employee_code||'')}"></div>
        <div class="field"><label>${t('empSalary')}</label><input type="text" id="mEmpSalary" value="${esc(emp.basic_salary||'')}"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-block" id="mCancel">${t('cancel')}</button>
        <button class="btn btn-primary btn-block" id="mSave">${t('saveBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mCancel').onclick = ()=> modal.remove();
  modal.querySelector('#mSave').onclick = async ()=>{
    const name = document.getElementById('mEmpName').value.trim();
    const desig = document.getElementById('mEmpDesig').value.trim();
    const code = document.getElementById('mEmpCode').value.trim();
    const salary = document.getElementById('mEmpSalary').value.trim();
    if(!name){ toast(t('fillRequired'), true); return; }
    try{
      const payloadEmp = empId? {id:empId, name, designation:desig, active:true, employee_code:code, basic_salary:salary}
                               : {name, designation:desig, active:true, employee_code:code, basic_salary:salary};
      const res = await API.call('saveEmployee', {employee: payloadEmp});
      if(res.ok){
        if(empId){
          const rec = STATE.employees.find(e=>e.id===empId);
          Object.assign(rec, res.employee);
        } else {
          STATE.employees.unshift(res.employee);
        }
        toast(t('savedOk'));
      } else if(res.error==='forbidden'){ toast(t('permNoAddEmp'), true); }
      else { toast(t('networkErr'), true); }
    }catch(e){ toast(t('networkErr'), true); }
    modal.remove();
    render();
  };
}

function openDivModal(){
  const modal = document.createElement('div');
  modal.className = 'modal-bg center';
  modal.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${t('addDivision')}</div>
      <div class="field"><label>${t('nameBn')}</label><input type="text" id="mDivBn"></div>
      <div class="field"><label>${t('nameEn')}</label><input type="text" id="mDivEn"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-block" id="mCancel">${t('cancel')}</button>
        <button class="btn btn-primary btn-block" id="mSave">${t('saveBtn')}</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#mCancel').onclick = ()=> modal.remove();
  modal.querySelector('#mSave').onclick = async ()=>{
    const bn = document.getElementById('mDivBn').value.trim();
    const en = document.getElementById('mDivEn').value.trim();
    if(!bn && !en){ toast(t('fillRequired'), true); return; }
    try{
      const res = await API.call('saveDivision', {division:{name_bn:bn||en, name_en:en||bn, is_default:false, active:true}});
      if(res.ok){ STATE.divisions.push(res.division); toast(t('savedOk')); }
      else toast(t('networkErr'), true);
    }catch(e){ toast(t('networkErr'), true); }
    modal.remove();
    render();
  };
}

/* ---------- boot sequence ---------- */
(async function boot(){
  STATE.screen = 'boot';
  render();

  if(!API.baseUrl){
    STATE.screen = 'setup';
    render();
    return;
  }

  if(API.token){
    try{
      const res = await API.call('verifySession');
      if(res && res.ok){
        STATE.session = {username: res.username, role: res.role};
        await loadBootstrap();
        STATE.screen = 'new';
        render();
        return;
      }
      // reachable but session invalid/expired — fall through to a normal login
      STATE.screen = 'login';
      render();
      return;
    }catch(e){
      // server unreachable/misconfigured — don't show a login screen that will
      // just fail again; go to setup with a clear, specific diagnosis instead
      STATE.screen = 'setup';
      render();
      document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
      return;
    }
  }

  // no saved token yet: confirm the server actually responds before showing login
  try{
    const res = await API.call('getBootstrap');
    if(!res || typeof res.ok !== 'boolean') throw new Error('bad_response');
  }catch(e){
    STATE.screen = 'setup';
    render();
    document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
    return;
  }

  STATE.screen = 'login';
  render();
})();
</script>
