<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F2E2C">
<title>OT_Record — অতিরিক্ত কর্মঘন্টা ব্যবস্থাপনা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2E2C;
  --ink-2:#163F3B;
  --paper:#F6F4EE;
  --paper-2:#EDEAE1;
  --line:#D9D4C6;
  --amber:#C77C2C;
  --amber-2:#E0954A;
  --rust:#B0483B;
  --moss:#4B7A5A;
  --white:#FFFFFF;
  --ink-soft:#5B6A66;
  --shadow: 0 1px 2px rgba(15,46,44,.06), 0 4px 14px rgba(15,46,44,.07);
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Hind Siliguri','Space Grotesk',system-ui,sans-serif;
  background:
    radial-gradient(1200px 500px at 100% -10%, rgba(199,124,44,.08), transparent 60%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  overflow-x:hidden;
}
.mono{font-family:'JetBrains Mono',monospace;}
.disp{font-family:'Space Grotesk',sans-serif;}
#root{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:82px;}

.topbar{
  position:sticky;top:0;z-index:30;
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--amber),var(--rust));
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;
  flex-shrink:0;
}
.brand-title{font-size:15px;font-weight:600;line-height:1.15;}
.brand-sub{font-size:10.5px;color:#9FC2B8;letter-spacing:.04em;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:var(--paper);width:34px;height:34px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;
}
.icon-btn:active{background:rgba(255,255,255,.18);}

main{padding:16px 16px 24px;}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card-title{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.card-title .tag{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--amber);
  background:rgba(199,124,44,.1);border:1px solid rgba(199,124,44,.25);
  padding:2px 6px;border-radius:5px;letter-spacing:.05em;
}

label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 6px;letter-spacing:.01em;}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=number],textarea,select{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14.5px;background:var(--paper);color:var(--ink);
  outline:none;transition:border-color .15s;
}
input:focus,textarea:focus,select:focus{border-color:var(--amber);background:#fff;}
textarea{resize:vertical;min-height:64px;}
.field{margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;border-radius:10px;border:none;font-weight:600;font-size:14px;
  cursor:pointer;font-family:inherit;transition:transform .06s, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;}
.btn-amber{background:var(--amber);color:#fff;}
.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:transparent;color:var(--rust);border:1.5px solid rgba(176,72,59,.3);}
.btn-ghost{background:rgba(15,46,44,.05);color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}

.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;
  background:var(--ink);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:40;box-shadow:0 -4px 16px rgba(0,0,0,.15);
}
.navitem{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;color:#7FA79C;cursor:pointer;
  font-size:10px;font-weight:600;letter-spacing:.01em;
}
.navitem .ni-ico{font-size:18px;line-height:1;}
.navitem.active{color:var(--amber-2);}

.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-amber{background:rgba(199,124,44,.12);color:var(--amber);}
.badge-moss{background:rgba(75,122,90,.12);color:var(--moss);}
.badge-rust{background:rgba(176,72,59,.12);color:var(--rust);}
.badge-gray{background:var(--paper-2);color:var(--ink-soft);}

.sheet-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:var(--shadow);
}
.sheet-card .date-block{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--amber);font-weight:600;
}
.sheet-card h4{margin:2px 0 6px;font-size:14.5px;font-weight:600;}
.sheet-card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.sheet-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.sheet-actions{display:flex;gap:8px;margin-top:10px;}
.sheet-emp-list{margin:8px 0;border-top:1px dashed var(--line);padding-top:6px;}
.sheet-emp-line{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3px 0;color:var(--ink-soft);}
.sheet-emp-line b{color:var(--ink);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-emp-line .t{font-family:'JetBrains Mono',monospace;color:var(--ink);white-space:nowrap;font-size:11px;}
.hrs-live{font-size:11.5px;color:var(--moss);font-weight:700;margin:-2px 0 8px;text-align:right;}
.hrs-live-total{font-size:12px;font-weight:700;color:var(--ink);text-align:right;margin-top:4px;padding-top:6px;border-top:1px dashed var(--line);}

.emp-row{
  display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--paper-2);
}
.emp-row:last-child{border-bottom:none;}
.emp-check{
  width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;
}
.emp-check.checked{background:var(--ink);border-color:var(--ink);color:var(--paper);font-size:13px;}
.emp-name{font-size:14px;font-weight:600;flex:1;}
.emp-desig{font-size:11px;color:var(--ink-soft);}

.slot-adjust{
  margin-top:8px;padding:10px;background:var(--paper);border-radius:10px;border:1px dashed var(--line);
}
.slot-adjust-title{font-size:11px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}

.slot-item{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 10px;
  background:var(--paper);border-radius:10px;
}
.slot-item span{font-size:12px;color:var(--ink-soft);}

.selectall-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 10px;background:var(--paper);border-radius:10px;margin-bottom:8px;
  border:1px dashed var(--line);
}
.selectall-bar span{font-size:12.5px;font-weight:600;color:var(--ink-soft);}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:32px 26px;box-shadow:0 10px 40px rgba(15,46,44,.15);border:1px solid var(--line);}
.login-logo{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--rust));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:22px;margin:0 auto 16px;}
.role-toggle{display:flex;background:var(--paper-2);border-radius:10px;padding:3px;margin-bottom:18px;}
.role-toggle button{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.role-toggle button.active{background:var(--ink);color:var(--paper);}
.spin{width:34px;height:34px;border:3px solid var(--paper-2);border-top-color:var(--amber);border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;font-size:12px;}
th,td{padding:8px 9px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--paper-2);}
th{background:var(--paper-2);font-weight:600;color:var(--ink-soft);font-size:10.5px;position:sticky;top:0;}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:right;font-weight:600;z-index:1;}
th:first-child{background:var(--paper-2);z-index:2;}
tr:nth-child(even) td{background:#FBFAF7;}
tr:nth-child(even) td:first-child{background:#FBFAF7;}
.cell-x{color:#C7C2B4;}
.cell-h{color:var(--moss);font-weight:600;}

.empty{text-align:center;padding:48px 20px;color:var(--ink-soft);}
.empty .ei{font-size:38px;margin-bottom:10px;opacity:.5;}
.empty p{font-size:13.5px;margin:4px 0;}

#toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:30px;
  font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;
  opacity:0;pointer-events:none;transition:all .25s ease;max-width:88%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--rust);}

.modal-bg{position:fixed;inset:0;background:rgba(15,46,44,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-bg.center{align-items:center;padding:20px;}
.modal-box{
  background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  animation:slideup .22s ease;
}
.modal-bg.center .modal-box{border-radius:18px;max-width:400px;animation:popin .18s ease;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes popin{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.modal-sub{font-size:12px;color:var(--ink-soft);margin:0 0 16px;}

.lang-toggle{display:flex;gap:6px;}
.lang-toggle button{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.lang-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-head h2{font-size:18px;font-weight:700;margin:0;font-family:'Space Grotesk',sans-serif;}
.section-head .sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.divider{height:1px;background:var(--line);margin:14px 0;}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat-box .sn{font-family:'Space Grotesk';font-size:22px;font-weight:700;color:var(--ink);}
.stat-box .sl{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

.img-thumb{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line);display:block;}
.upload-box{
  border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;background:var(--paper);font-size:12.5px;color:var(--ink-soft);
}

.search-box{position:relative;margin-bottom:14px;}
.search-box input{padding-left:36px;}
.search-box::before{content:'⌕';position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}

.pill-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.pill{flex-shrink:0;padding:7px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

::-webkit-scrollbar{height:5px;width:5px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}

.warn-box{background:rgba(176,72,59,.08);border:1px solid rgba(176,72,59,.25);color:var(--rust);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;font-weight:500;}
.info-box{background:rgba(75,122,90,.08);border:1px solid rgba(75,122,90,.25);color:var(--moss);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;}

.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.sync-dot.on{background:var(--moss);box-shadow:0 0 0 3px rgba(75,122,90,.15);}
.sync-dot.off{background:#C7C2B4;}
.sync-dot.busy{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.steps-box{font-size:12px;color:var(--ink-soft);line-height:1.85;background:var(--paper);border-radius:10px;padding:12px 14px;}
.steps-box b{color:var(--ink);}
.steps-box a{color:var(--amber);text-decoration:none;font-weight:600;}
.topbar-sync{display:flex;align-items:center;font-size:10px;color:#9FC2B8;}
</style>
</head>
<body>
<div id="root"><div id="loadingFallback" style="text-align:center;padding:60px 20px;font-family:sans-serif;color:#5B6A66;">Loading…</div></div>
<div id="toast"></div>

<script>
  window.addEventListener('error', function(e){
    var el = document.getElementById('root');
    // only show this overlay if nothing has actually rendered yet
    // (avoids masking a working screen if an unrelated later error fires)
    if(el && document.getElementById('loadingFallback')){
      el.innerHTML = '<div style="max-width:420px;margin:60px auto;padding:20px;font-family:sans-serif;color:#B0483B;background:#FBECEA;border:1px solid #E8B4AE;border-radius:10px;">'
        + '<b>Something failed to load.</b><br><br>'
        + 'Message: ' + (e.message || 'unknown error') + '<br>'
        + (e.filename ? ('File: ' + e.filename + (e.lineno ? (' (line ' + e.lineno + ')') : '') + '<br>') : '')
        + '<br>Make sure <code>common.js</code> is uploaded in the exact same folder as this file.'
        + '</div>';
    }
  });
</script>
<script src="common.js" onerror="document.getElementById('root').innerHTML='<div style=&quot;max-width:420px;margin:60px auto;padding:20px;font-family:sans-serif;color:#B0483B;background:#FBECEA;border:1px solid #E8B4AE;border-radius:10px;&quot;><b>common.js failed to load.</b><br><br>Make sure common.js is uploaded in the exact same folder as this file, with that exact filename.</div>'"></script>
<script>
/* ---------- render root (this page only ever shows boot/setup/login) ---------- */
function render(){
  const root = document.getElementById('root');
  document.documentElement.lang = STATE.lang;

  if(STATE.screen==='boot'){ root.innerHTML = renderBootScreen(); return; }
  if(STATE.screen==='setup'){ root.innerHTML = renderSetupScreen(); bindSetupScreen(); return; }

  root.innerHTML = renderLogin();
  bindLogin();
}

/* =========================================================
   BOOT / SETUP SCREENS
   ========================================================= */
function renderBootScreen(){
  return `
  <div class="login-wrap">
    <div class="login-card" style="text-align:center;">
      <div class="login-logo">OT</div>
      <div class="spin"></div>
      <div class="disp" style="font-size:16px;font-weight:700;">${t('connecting')}</div>
    </div>
  </div>`;
}

function renderSetupScreen(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">OT</div>
      <div style="text-align:center;margin-bottom:18px;">
        <div class="disp" style="font-size:18px;font-weight:700;">${t('setupApiTitle')}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">${t('appSub')}</div>
      </div>
      <div class="field">
        <label>${t('apiUrlLabel')}</label>
        <input type="text" id="setApiUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(API.baseUrl)}">
      </div>
      <div class="info-box">${t('apiUrlHelp')}</div>
      <div id="setupErrBox"></div>
      <button class="btn btn-amber btn-block" id="btnSetupSave">${t('saveContinue')}</button>
      ${API.baseUrl? `<button class="btn btn-outline btn-block" id="btnTestConn" style="margin-top:8px;">${t('testConnection')}</button>` : ''}
      <div style="text-align:center;margin-top:16px;">
        <span class="lang-toggle">
          <button data-l="bn" class="${STATE.lang==='bn'?'active':''}">বাংলা</button>
          <button data-l="en" class="${STATE.lang==='en'?'active':''}">EN</button>
        </span>
      </div>
    </div>
  </div>`;
}
function bindSetupScreen(){
  document.querySelectorAll('[data-l]').forEach(b=>{
    b.onclick = ()=>{ STATE.lang = b.getAttribute('data-l'); LS.set('otr_lang',STATE.lang); render(); };
  });
  document.getElementById('btnSetupSave').onclick = async ()=>{
    const url = document.getElementById('setApiUrl').value.trim();
    document.getElementById('setupErrBox').innerHTML = '';
    if(!url){ document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${t('fillRequired')}</div>`; return; }
    if(!/^https:\/\//i.test(url)){
      document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${t('errNotHttps')}</div>`;
      return;
    }
    API.setBaseUrl(url);
    await testConnectionAndProceed();
  };
  const testBtn = document.getElementById('btnTestConn');
  if(testBtn) testBtn.onclick = async ()=>{
    const url = document.getElementById('setApiUrl').value.trim();
    if(url) API.setBaseUrl(url);
    await testConnectionAndProceed();
  };
}
async function testConnectionAndProceed(){
  STATE.screen = 'boot';
  render();
  try{
    const res = await API.call('getBootstrap'); // with no token this correctly returns {ok:false,error:'unauthorized'} — that response alone proves the server is reachable and speaking our API
    if(!res || typeof res.ok !== 'boolean'){ throw new Error('bad_response'); }
    STATE.screen = STATE.session ? 'new' : 'login';
    render();
  }catch(e){
    STATE.screen = 'setup';
    render();
    document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
  }
}

/* ---------- topbar ---------- */
/* =========================================================
   LOGIN  (username + password only — no Google account, ever)
   ========================================================= */
let loginRole = 'admin';
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">OT</div>
      <div style="text-align:center;margin-bottom:20px;">
        <div class="disp" style="font-size:19px;font-weight:700;">${T[STATE.lang].appName}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${T[STATE.lang].appSub}</div>
      </div>
      <div class="role-toggle">
        <button data-role="admin" class="${loginRole==='admin'?'active':''}">${T[STATE.lang].roleAdmin}</button>
        <button data-role="employee" class="${loginRole==='employee'?'active':''}">${T[STATE.lang].roleEmployee}</button>
      </div>
      <div class="field">
        <label>${T[STATE.lang].username}</label>
        <input type="text" id="loginUser" placeholder="${loginRole==='admin'?'admin':'user'}">
      </div>
      <div class="field">
        <label>${T[STATE.lang].password}</label>
        <input type="password" id="loginPass" placeholder="••••">
      </div>
      <div id="loginErrBox"></div>
      <button class="btn btn-primary btn-block" id="btnSignIn">${T[STATE.lang].signin}</button>
      <div style="text-align:center;margin-top:16px;">
        <span class="lang-toggle">
          <button data-l="bn" class="${STATE.lang==='bn'?'active':''}">বাংলা</button>
          <button data-l="en" class="${STATE.lang==='en'?'active':''}">EN</button>
        </span>
      </div>
      <button class="btn btn-ghost btn-block" id="btnEditApiUrl" style="margin-top:14px;font-size:12px;">${t('editApiUrl')}</button>
    </div>
  </div>`;
}
function bindLogin(){
  document.querySelectorAll('[data-role]').forEach(b=>{
    b.onclick = ()=>{ loginRole = b.getAttribute('data-role'); render(); };
  });
  document.querySelectorAll('[data-l]').forEach(b=>{
    b.onclick = ()=>{ STATE.lang = b.getAttribute('data-l'); LS.set('otr_lang',STATE.lang); render(); };
  });
  document.getElementById('btnSignIn').onclick = doLogin;
  document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('btnEditApiUrl').onclick = ()=> API.changeServer();
}
async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const btn = document.getElementById('btnSignIn');
  btn.disabled = true;
  document.getElementById('loginErrBox').innerHTML = '';
  try{
    const res = await API.login(u, p);
    if(!res.ok || res.role !== loginRole){
      const msg = res.error==='locked_out' ? t('lockedOut') : t('loginErr');
      document.getElementById('loginErrBox').innerHTML = `<div class="warn-box">${msg}</div>`;
      btn.disabled = false;
      return;
    }
    window.location.href = 'app.html';
  }catch(e){
    document.getElementById('loginErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
    btn.disabled = false;
  }
}

/* ---------- boot sequence ---------- */
(async function boot(){
  STATE.screen = 'boot';
  render();

  if(!API.baseUrl){
    STATE.screen = 'setup';
    render();
    return;
  }

  if(API.token){
    try{
      const res = await API.call('verifySession');
      if(res && res.ok){
        window.location.href = 'app.html';
        return;
      }
      STATE.screen = 'login';
      render();
      return;
    }catch(e){
      STATE.screen = 'setup';
      render();
      document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
      return;
    }
  }

  try{
    const res = await API.call('getBootstrap');
    if(!res || typeof res.ok !== 'boolean') throw new Error('bad_response');
  }catch(e){
    STATE.screen = 'setup';
    render();
    document.getElementById('setupErrBox').innerHTML = `<div class="warn-box">${diagnoseErr(e)}</div>`;
    return;
  }

  STATE.screen = 'login';
  render();
})();

</script>
</body>
</html>
